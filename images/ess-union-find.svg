<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">UNION-FIND: FLATTEN THE PATH, HANG THE SMALLER TREE</text>

  <text x="40" y="78" fill="#94a3b8" font-size="11.5">find(d) before compression &#8212; a chain</text>
  <g font-size="11" text-anchor="middle" font-family="Consolas, monospace">
    <circle cx="60"  cy="112" r="14" fill="#1e3a8a" stroke="#3b82f6"/><text x="60"  y="116" fill="#93c5fd">d</text>
    <circle cx="115" cy="112" r="14" fill="#1e3a8a" stroke="#3b82f6"/><text x="115" y="116" fill="#93c5fd">c</text>
    <circle cx="170" cy="112" r="14" fill="#1e3a8a" stroke="#3b82f6"/><text x="170" y="116" fill="#93c5fd">b</text>
    <circle cx="225" cy="112" r="14" fill="#1e3a8a" stroke="#f59e0b"/><text x="225" y="116" fill="#f59e0b">a</text>
  </g>
  <line x1="76"  y1="112" x2="99"  y2="112" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="131" y1="112" x2="154" y2="112" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="186" y1="112" x2="209" y2="112" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <text x="225" y="88" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">root</text>

  <line x1="252" y1="112" x2="305" y2="112" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="278" y="100" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">compress</text>

  <line x1="380" y1="101" x2="343" y2="133" stroke="#3b82f6" stroke-width="2"/>
  <line x1="390" y1="103" x2="390" y2="131" stroke="#3b82f6" stroke-width="2"/>
  <line x1="400" y1="101" x2="437" y2="133" stroke="#3b82f6" stroke-width="2"/>
  <g font-size="11" text-anchor="middle" font-family="Consolas, monospace">
    <circle cx="390" cy="88"  r="14" fill="#1e3a8a" stroke="#f59e0b"/><text x="390" y="92"  fill="#f59e0b">a</text>
    <circle cx="335" cy="145" r="14" fill="#1e3a8a" stroke="#3b82f6"/><text x="335" y="149" fill="#93c5fd">b</text>
    <circle cx="390" cy="145" r="14" fill="#1e3a8a" stroke="#3b82f6"/><text x="390" y="149" fill="#93c5fd">c</text>
    <circle cx="445" cy="145" r="14" fill="#1e3a8a" stroke="#3b82f6"/><text x="445" y="149" fill="#93c5fd">d</text>
  </g>
  <text x="390" y="176" fill="#94a3b8" font-size="11.5" text-anchor="middle">one hop, forever after</text>

  <text x="40" y="212" fill="#94a3b8" font-size="11.5">union by size</text>
  <polygon points="95,232 55,300 135,300" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="95" cy="232" r="9" fill="#f59e0b" stroke="#f59e0b"/>
  <text x="95" y="288" fill="#93c5fd" font-size="11.5" text-anchor="middle" font-family="Consolas, monospace">size 5</text>
  <polygon points="265,250 235,300 295,300" fill="#4c1d95" stroke="#a78bfa"/>
  <circle cx="265" cy="250" r="8" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="265" y="292" fill="#c4b5fd" font-size="11.5" text-anchor="middle" font-family="Consolas, monospace">size 2</text>
  <path d="M 258 243 C 215 205 150 205 108 224" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="185" y="198" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">attach the smaller root</text>
  <text x="320" y="272" fill="#94a3b8" font-size="11.5">only the smaller</text>
  <text x="320" y="290" fill="#94a3b8" font-size="11.5">tree gains a level</text>

  <text x="40" y="330" fill="#34d399" font-size="12.5" font-weight="bold">depth can only grow when the two sizes are EQUAL,</text>
  <text x="40" y="350" fill="#34d399" font-size="12.5" font-weight="bold">so the forest stays O(log n) deep before compression</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">DSU stores the equivalence relation and nothing</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">else &#8212; exactly enough for connectivity, which is</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">why it beats traversal when edges arrive over time</text>

  <text x="510" y="162" fill="#f59e0b" font-size="12.5" font-weight="bold">compression shortens what you just walked;</text>
  <text x="510" y="182" fill="#f59e0b" font-size="12.5" font-weight="bold">union-by-size stops chains forming. Both together</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5" font-weight="bold">&#8658; O(alpha(n)) amortized, effectively constant</text>

  <text x="510" y="236" fill="#34d399" font-size="12.5" font-weight="bold">unite() returning false means the two ends already</text>
  <text x="510" y="256" fill="#34d399" font-size="12.5" font-weight="bold">shared a root &#8658; that edge closes a cycle &#8212; cycle</text>
  <text x="510" y="276" fill="#34d399" font-size="12.5" font-weight="bold">detection with no traversal at all</text>

  <text x="510" y="310" fill="#f87171" font-size="12">canonicalize first: compare find(a) with find(b),</text>
  <text x="510" y="328" fill="#f87171" font-size="12">never the raw ids &#8212; the classic DSU bug</text>

  <text x="510" y="358" fill="#64748b" font-size="11.5">no un-union exists; deletions need a different structure</text>
</svg>
