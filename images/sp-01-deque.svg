<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">0-1 BFS: THE DEQUE IS THE HEAP, FOR FREE</text>

  <text x="110" y="70" fill="#94a3b8" font-size="11.5">front</text>
  <text x="352" y="70" fill="#94a3b8" font-size="11.5" text-anchor="end">back</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="110" y="78" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="138" y="100" fill="#93c5fd">d</text>
    <rect x="172" y="78" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="200" y="100" fill="#93c5fd">d</text>
    <rect x="234" y="78" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="262" y="100" fill="#c4b5fd">d+1</text>
    <rect x="296" y="78" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="324" y="100" fill="#c4b5fd">d+1</text>
  </g>

  <line x1="138" y1="116" x2="138" y2="148" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="152" y="145" fill="#f59e0b" font-size="12.5" font-weight="bold">pop front &#8658; u is settled at d</text>

  <line x1="138" y1="158" x2="90"  y2="196" stroke="#3b82f6"  stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="160" y1="158" x2="300" y2="196" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arPurple)"/>

  <text x="40"  y="216" fill="#93c5fd" font-size="12.5" font-weight="bold">0-edge: still distance d</text>
  <text x="40"  y="234" fill="#94a3b8" font-size="11.5">same layer &#8658; push FRONT</text>
  <text x="290" y="216" fill="#c4b5fd" font-size="12.5" font-weight="bold">1-edge: distance d+1</text>
  <text x="290" y="234" fill="#94a3b8" font-size="11.5">next layer &#8658; push BACK</text>

  <path d="M 62 200 C 40 158 60 120 104 110" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <path d="M 396 200 C 420 158 400 120 358 110" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arPurple)"/>

  <text x="40" y="272" fill="#34d399" font-size="12.5" font-weight="bold">the deque never holds more than two distinct distances,</text>
  <text x="40" y="290" fill="#34d399" font-size="12.5" font-weight="bold">so its front is always the global minimum</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">with only two weights, the frontier can span at most</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">d and d+1 &#8212; so &#8220;extract-min&#8221; degenerates to &#8220;read the</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">front,&#8221; and the heap's log factor evaporates</text>

  <text x="510" y="162" fill="#f59e0b" font-size="12.5" font-weight="bold">relax like Dijkstra, not like BFS: compare distances</text>
  <text x="510" y="182" fill="#f59e0b" font-size="12.5" font-weight="bold">and skip stale pops &#8212; no visited-at-enqueue, because</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5" font-weight="bold">a queued node can still improve via a 0-edge</text>

  <text x="510" y="238" fill="#34d399" font-size="12.5" font-weight="bold">same guarantee as Dijkstra at O(V + E) cost</text>

  <text x="510" y="270" fill="#f87171" font-size="12">push a 0-edge to the back and the deque stops being</text>
  <text x="510" y="288" fill="#f87171" font-size="12">sorted: it still terminates, just with wrong answers</text>
  <text x="510" y="306" fill="#f87171" font-size="12">&#8212; the front-push IS the correctness argument</text>
</svg>
