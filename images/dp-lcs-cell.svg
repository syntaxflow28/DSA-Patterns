<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">TWO-SEQUENCE TABLE: THREE READS WITH FIXED MEANINGS</text>

  <text x="40" y="72" fill="#94a3b8" font-size="11.5">dp[i][j] = the answer for prefix A[0..i) against prefix B[0..j)</text>

  <g font-size="11" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="76"  y="90"  width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="104" y="111" fill="#a5b4fc">base</text>
    <rect x="152" y="90"  width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="180" y="111" fill="#a5b4fc">base</text>
    <rect x="228" y="90"  width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="256" y="111" fill="#a5b4fc">base</text>
    <rect x="304" y="90"  width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="332" y="111" fill="#a5b4fc">base</text>

    <rect x="76"  y="144" width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="104" y="165" fill="#a5b4fc">base</text>
    <rect x="152" y="144" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#34d399"/><text x="180" y="165" fill="#34d399">i-1,j-1</text>
    <rect x="228" y="144" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="256" y="165" fill="#93c5fd">i-1,j</text>
    <rect x="304" y="144" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="332" y="165" fill="#93c5fd">&#183;</text>

    <rect x="76"  y="198" width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="104" y="219" fill="#a5b4fc">base</text>
    <rect x="152" y="198" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="180" y="219" fill="#93c5fd">i,j-1</text>
    <rect x="228" y="198" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="256" y="219" fill="#0f172a">i,j</text>
    <rect x="304" y="198" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="332" y="219" fill="#93c5fd">&#183;</text>

    <rect x="76"  y="252" width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="104" y="273" fill="#a5b4fc">base</text>
    <rect x="152" y="252" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="180" y="273" fill="#93c5fd">&#183;</text>
    <rect x="228" y="252" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="256" y="273" fill="#93c5fd">&#183;</text>
    <rect x="304" y="252" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="332" y="273" fill="#93c5fd">&#183;</text>
  </g>

  <line x1="210" y1="180" x2="226" y2="196" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <line x1="256" y1="182" x2="256" y2="196" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="210" y1="215" x2="226" y2="215" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>

  <text x="376" y="166" fill="#34d399" font-size="11">diagonal</text>
  <text x="376" y="216" fill="#93c5fd" font-size="11">up / left</text>

  <text x="40" y="312" fill="#34d399" font-size="12" font-weight="bold">A[i-1] == B[j-1] &#8594; DIAGONAL: both tails consumed together</text>
  <text x="40" y="332" fill="#93c5fd" font-size="12" font-weight="bold">otherwise &#8594; UP drops A's tail, LEFT drops B's tail</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">base row / column = one sequence empty &#8212; real answers, not filler zeros</text>

  <text x="510" y="90"  fill="#e2e8f0" font-size="12.5">an alignment of two sequences can only END in a constant</text>
  <text x="510" y="110" fill="#e2e8f0" font-size="12.5">number of ways &#8212; matched, deleted, inserted, substituted</text>
  <text x="510" y="130" fill="#e2e8f0" font-size="12.5">&#8212; and each ending leaves a PAIR OF SHORTER PREFIXES</text>

  <text x="510" y="162" fill="#f59e0b" font-size="12.5" font-weight="bold">pairs of prefixes number only (n+1)(m+1), so the</text>
  <text x="510" y="182" fill="#f59e0b" font-size="12.5" font-weight="bold">exponential space of alignments collapses into a table</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5" font-weight="bold">whose every cell is a constant-case decision</text>

  <text x="510" y="234" fill="#34d399" font-size="12.5" font-weight="bold">the three reads keep the same meaning family-wide &#8212;</text>
  <text x="510" y="254" fill="#34d399" font-size="12.5" font-weight="bold">1143, 72, 115, 44 and 10 are ONE table with different</text>
  <text x="510" y="274" fill="#34d399" font-size="12.5" font-weight="bold">case logic bolted onto the same three arrows</text>

  <text x="510" y="306" fill="#f87171" font-size="12">dp[i][j] covers prefixes of LENGTH i and j, so the chars</text>
  <text x="510" y="324" fill="#f87171" font-size="12">compared are A[i-1] and B[j-1]; silently mixing 0-indexed</text>
  <text x="510" y="342" fill="#f87171" font-size="12">strings with a 1-indexed table is the family's sure bug</text>

  <text x="510" y="368" fill="#64748b" font-size="11.5">no reconstruction wanted &#8658; roll the table to two rows</text>
</svg>
