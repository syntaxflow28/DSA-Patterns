<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="370" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">A HEAP IS ONE INVARIANT &#8212; AND EVERYTHING IT REFUSES TO DO</text>

  <g stroke="#334155" stroke-width="1.5">
    <line x1="230" y1="112" x2="158" y2="148"/>
    <line x1="230" y1="112" x2="302" y2="148"/>
    <line x1="155" y1="183" x2="112" y2="212"/>
    <line x1="155" y1="183" x2="197" y2="212"/>
    <line x1="305" y1="183" x2="273" y2="212"/>
  </g>

  <g text-anchor="middle" font-family="Consolas, monospace" font-weight="bold">
    <circle cx="230" cy="95" r="22" fill="#f59e0b" stroke="#f59e0b"/><text x="230" y="100" fill="#0f172a" font-size="14">9</text>
    <circle cx="155" cy="165" r="21" fill="#1e3a8a" stroke="#3b82f6"/><text x="155" y="170" fill="#93c5fd" font-size="13">7</text>
    <circle cx="305" cy="165" r="21" fill="#1e3a8a" stroke="#3b82f6"/><text x="305" y="170" fill="#93c5fd" font-size="13">8</text>
    <circle cx="110" cy="228" r="19" fill="#4c1d95" stroke="#a78bfa"/><text x="110" y="233" fill="#c4b5fd" font-size="13">3</text>
    <circle cx="200" cy="228" r="19" fill="#4c1d95" stroke="#a78bfa"/><text x="200" y="233" fill="#c4b5fd" font-size="13">5</text>
    <circle cx="270" cy="228" r="19" fill="#4c1d95" stroke="#a78bfa"/><text x="270" y="233" fill="#c4b5fd" font-size="13">2</text>
  </g>
  <text x="262" y="90" fill="#f59e0b" font-size="11" font-weight="bold">root: the only guaranteed answer</text>

  <text x="40" y="258" fill="#94a3b8" font-size="11.5">the very same heap, stored flat:</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="60"  y="270" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="88"  y="292" fill="#0f172a">9</text>
    <rect x="122" y="270" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="150" y="292" fill="#93c5fd">7</text>
    <rect x="184" y="270" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="212" y="292" fill="#93c5fd">8</text>
    <rect x="246" y="270" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="274" y="292" fill="#c4b5fd">3</text>
    <rect x="308" y="270" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="336" y="292" fill="#c4b5fd">5</text>
    <rect x="370" y="270" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="398" y="292" fill="#c4b5fd">2</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace">
    <text x="88"  y="320">i=0</text>
    <text x="150" y="320">1</text>
    <text x="212" y="320">2</text>
    <text x="274" y="320">3</text>
    <text x="336" y="320">4</text>
    <text x="398" y="320">5</text>
  </g>
  <text x="40" y="346" fill="#64748b" font-size="11.5">ask it for the 3rd best and it shrugs &#8212; you must pop twice</text>

  <text x="510" y="85" fill="#f59e0b" font-size="12.5" font-weight="bold">ONE invariant: every parent beats its children</text>
  <text x="510" y="105" fill="#94a3b8" font-size="11.5">(&#8805; for a max-heap, &#8804; for a min-heap) &#8212; and that is all</text>
  <text x="510" y="138" fill="#e2e8f0" font-size="12.5">complete tree &#8658; a flat array: index 0 is the root and</text>
  <text x="510" y="158" fill="#e2e8f0" font-size="12.5">the children of i live at 2i+1 and 2i+2. No pointers.</text>
  <text x="510" y="191" fill="#34d399" font-size="12.5" font-weight="bold">root is the global best in O(1); insert and remove</text>
  <text x="510" y="211" fill="#34d399" font-size="12.5" font-weight="bold">repair one root-to-leaf path &#8658; O(log n), build O(n)</text>
  <text x="510" y="244" fill="#f87171" font-size="12" font-weight="bold">what a heap does NOT give you:</text>
  <text x="510" y="264" fill="#f87171" font-size="12">7 sits LEFT of the larger 8 &#8212; siblings and whole</text>
  <text x="510" y="282" fill="#f87171" font-size="12">subtrees are unordered; a heap is not sorted</text>
  <text x="510" y="300" fill="#f87171" font-size="12">no search: an arbitrary value costs O(n)</text>
  <text x="510" y="318" fill="#f87171" font-size="12">no sorted iteration &#8212; reading it in order destroys it</text>
  <text x="510" y="348" fill="#64748b" font-size="11.5">strictly less information than a sort &#8212; that is the point</text>
</svg>
