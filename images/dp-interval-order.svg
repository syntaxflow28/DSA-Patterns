<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">INTERVAL DP: SPAN LENGTH IS THE TOPOLOGICAL ORDER (n = 5)</text>

  <text x="40" y="70" fill="#94a3b8" font-size="11.5">cells are dp[i][j] over i &#8804; j &#8212; only the upper triangle exists</text>

  <g stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <rect x="60"  y="122" width="44" height="26" rx="6"/>
    <rect x="60"  y="162" width="44" height="26" rx="6"/>
    <rect x="112" y="162" width="44" height="26" rx="6"/>
    <rect x="60"  y="202" width="44" height="26" rx="6"/>
    <rect x="112" y="202" width="44" height="26" rx="6"/>
    <rect x="164" y="202" width="44" height="26" rx="6"/>
    <rect x="60"  y="242" width="44" height="26" rx="6"/>
    <rect x="112" y="242" width="44" height="26" rx="6"/>
    <rect x="164" y="242" width="44" height="26" rx="6"/>
    <rect x="216" y="242" width="44" height="26" rx="6"/>
  </g>

  <g font-size="10.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="60"  y="82"  width="44" height="26" rx="6" fill="#064e3b" stroke="#34d399"/><text x="82"  y="99"  fill="#34d399">0,0</text>
    <rect x="112" y="82"  width="44" height="26" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="134" y="99"  fill="#93c5fd">0,1</text>
    <rect x="164" y="82"  width="44" height="26" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="186" y="99"  fill="#c4b5fd">0,2</text>
    <rect x="216" y="82"  width="44" height="26" rx="6" fill="#831843" stroke="#f472b6"/><text x="238" y="99"  fill="#f9a8d4">0,3</text>
    <rect x="268" y="82"  width="44" height="26" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="290" y="99"  fill="#0f172a">0,4</text>

    <rect x="112" y="122" width="44" height="26" rx="6" fill="#064e3b" stroke="#34d399"/><text x="134" y="139" fill="#34d399">1,1</text>
    <rect x="164" y="122" width="44" height="26" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="186" y="139" fill="#93c5fd">1,2</text>
    <rect x="216" y="122" width="44" height="26" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="238" y="139" fill="#c4b5fd">1,3</text>
    <rect x="268" y="122" width="44" height="26" rx="6" fill="#831843" stroke="#f472b6"/><text x="290" y="139" fill="#f9a8d4">1,4</text>

    <rect x="164" y="162" width="44" height="26" rx="6" fill="#064e3b" stroke="#34d399"/><text x="186" y="179" fill="#34d399">2,2</text>
    <rect x="216" y="162" width="44" height="26" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="238" y="179" fill="#93c5fd">2,3</text>
    <rect x="268" y="162" width="44" height="26" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="290" y="179" fill="#c4b5fd">2,4</text>

    <rect x="216" y="202" width="44" height="26" rx="6" fill="#064e3b" stroke="#34d399"/><text x="238" y="219" fill="#34d399">3,3</text>
    <rect x="268" y="202" width="44" height="26" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="290" y="219" fill="#93c5fd">3,4</text>

    <rect x="268" y="242" width="44" height="26" rx="6" fill="#064e3b" stroke="#34d399"/><text x="290" y="259" fill="#34d399">4,4</text>
  </g>

  <line x1="330" y1="252" x2="330" y2="96" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arAmber)"/>

  <text x="346" y="140" fill="#f59e0b" font-size="11.5" font-weight="bold">fill order</text>
  <text x="346" y="160" fill="#34d399" font-size="11">len 1 &#8212; the diagonal</text>
  <text x="346" y="178" fill="#93c5fd" font-size="11">len 2</text>
  <text x="346" y="196" fill="#c4b5fd" font-size="11">len 3</text>
  <text x="346" y="214" fill="#f9a8d4" font-size="11">len 4</text>
  <text x="346" y="232" fill="#f59e0b" font-size="11">len 5 = the answer</text>

  <text x="40" y="296" fill="#34d399" font-size="12" font-weight="bold">every split of [i, j] produces strictly shorter spans</text>
  <text x="40" y="314" fill="#94a3b8" font-size="11.5">so every read lands in a layer that is already finished</text>
  <text x="40" y="336" fill="#64748b" font-size="11.5">the lower triangle (j &lt; i) is never touched</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">dp[i][j] reads dp[i+1][j], dp[i][j-1] and every split</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">dp[i][k] + dp[k+1][j] &#8212; all of them shorter spans</text>

  <text x="510" y="140" fill="#f59e0b" font-size="12.5" font-weight="bold">so &#8220;by increasing length&#8221; IS the topological order;</text>
  <text x="510" y="160" fill="#f59e0b" font-size="12.5" font-weight="bold">i descending with j ascending is that same order, coded</text>

  <text x="510" y="192" fill="#34d399" font-size="12.5" font-weight="bold">the real discovery is picking the last decision that</text>
  <text x="510" y="212" fill="#34d399" font-size="12.5" font-weight="bold">DECOUPLES the halves &#8212; the LAST balloon to burst, not</text>
  <text x="510" y="232" fill="#34d399" font-size="12.5" font-weight="bold">the first, leaves two sides that never interacted</text>

  <text x="510" y="264" fill="#f87171" font-size="12">any loop that lets dp[i][j] read an equal-or-longer span</text>
  <text x="510" y="282" fill="#f87171" font-size="12">is garbage-in &#8212; verify the reads before trusting output</text>

  <text x="510" y="312" fill="#64748b" font-size="11.5">O(n^2) cells x O(n) splits = O(n^3) &#8212; budget for n &#8804; ~500;</text>
  <text x="510" y="330" fill="#64748b" font-size="11.5">if intervals alone are insufficient (546), extend the state</text>
</svg>
