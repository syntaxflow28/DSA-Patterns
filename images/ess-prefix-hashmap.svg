<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">PREFIX SUMS: A RANGE CONDITION BECOMES A LOOKUP</text>

  <text x="40" y="80" fill="#94a3b8" font-size="11.5">prefix values along the scan</text>
  <line x1="45" y1="118" x2="440" y2="118" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <circle cx="60"  cy="118" r="8" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="160" cy="118" r="8" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="400" cy="118" r="9" fill="#f59e0b" stroke="#f59e0b"/>
  <text x="60"  y="104" fill="#93c5fd" font-size="11.5" text-anchor="middle" font-family="Consolas, monospace">P0</text>
  <text x="160" y="104" fill="#93c5fd" font-size="11.5" text-anchor="middle" font-family="Consolas, monospace">Pi</text>
  <text x="400" y="102" fill="#f59e0b" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">Pj</text>

  <path d="M 160 134 L 160 146 L 400 146 L 400 134" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="280" y="166" fill="#c4b5fd" font-size="11.5" text-anchor="middle">subarray i+1 .. j</text>
  <text x="280" y="188" fill="#c4b5fd" font-size="12.5" text-anchor="middle" font-family="Consolas, monospace">sum = Pj - Pi</text>

  <text x="40" y="222" fill="#f59e0b" font-size="12.5" font-weight="bold" font-family="Consolas, monospace">want Pj - Pi = k   &#8658;   Pi = Pj - k</text>

  <text x="40" y="256" fill="#94a3b8" font-size="11.5">order of operations at position j:</text>
  <text x="40"  y="280" fill="#34d399" font-size="12.5" font-family="Consolas, monospace">1. count += seen[Pj - k];</text>
  <text x="260" y="280" fill="#64748b" font-size="12.5" font-family="Consolas, monospace">// query</text>
  <text x="40"  y="302" fill="#34d399" font-size="12.5" font-family="Consolas, monospace">2. seen[Pj]++;</text>
  <text x="260" y="302" fill="#64748b" font-size="12.5" font-family="Consolas, monospace">// then insert</text>
  <text x="40" y="330" fill="#94a3b8" font-size="11.5">query first &#8658; every match came from a strictly earlier i</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">a condition over a range turns into an equality</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">between two point values &#8212; and equality is exactly</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">what a hashmap resolves in O(1), order irrelevant</text>

  <text x="510" y="162" fill="#34d399" font-size="12.5" font-weight="bold">this is where sliding windows die: a window needs</text>
  <text x="510" y="182" fill="#34d399" font-size="12.5" font-weight="bold">monotonicity, which negatives destroy &#8212; prefix</text>
  <text x="510" y="202" fill="#34d399" font-size="12.5" font-weight="bold">differences never required it in the first place</text>

  <text x="510" y="236" fill="#f59e0b" font-size="12.5" font-weight="bold">seen[0] = 1 seeds the empty prefix; without it</text>
  <text x="510" y="256" fill="#f59e0b" font-size="12.5" font-weight="bold">every subarray starting at index 0 is missed</text>

  <text x="510" y="290" fill="#f87171" font-size="12">insert before you query and Pj matches itself &#8212;</text>
  <text x="510" y="308" fill="#f87171" font-size="12">a bogus zero-length subarray whenever k = 0</text>

  <text x="510" y="340" fill="#64748b" font-size="11.5">same compilation for parity (1248) and remainders (974)</text>
</svg>
