<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">MONOTONIC DEQUE: KEEP ONLY THE NON-DOMINATED</text>

  <text x="242" y="76" fill="#f9a8d4" font-size="11.5" font-weight="bold" text-anchor="middle">back-pop</text>
  <line x1="242" y1="82" x2="242" y2="104" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>

  <text x="42" y="132" fill="#94a3b8" font-size="11.5">front</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="90"  y="110" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="118" y="132" fill="#93c5fd">9</text>
    <rect x="152" y="110" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="180" y="132" fill="#93c5fd">7</text>
    <rect x="214" y="110" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#f472b6"/><text x="242" y="132" fill="#f9a8d4">4</text>
    <rect x="320" y="110" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="348" y="132" fill="#0f172a">6</text>
  </g>
  <text x="278" y="132" fill="#94a3b8" font-size="11.5">back</text>

  <line x1="118" y1="146" x2="118" y2="166" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arSlate)"/>
  <text x="118" y="182" fill="#94a3b8" font-size="11" text-anchor="middle">front-pop if index &#8804; right - k</text>
  <text x="118" y="198" fill="#64748b" font-size="11" text-anchor="middle">it has aged out of the window</text>

  <line x1="348" y1="170" x2="348" y2="150" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="348" y="186" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">newcomer</text>

  <text x="40" y="228" fill="#f9a8d4" font-size="12.5" font-weight="bold">4 is older AND no larger than 6 &#8212; dominated</text>
  <text x="40" y="246" fill="#94a3b8" font-size="11.5">it can never be the max of a future window holding 6</text>

  <text x="40" y="278" fill="#34d399" font-size="12.5" font-weight="bold">the deque IS the non-dominated frontier</text>
  <text x="40" y="296" fill="#94a3b8" font-size="11.5">indices increase left to right, values strictly decrease</text>
  <text x="40" y="320" fill="#64748b" font-size="11.5">store INDICES, not values &#8212; expiry needs the index</text>

  <text x="510" y="88" fill="#e2e8f0" font-size="13" font-weight="bold">the amortized accounting</text>
  <text x="510" y="118" fill="#e2e8f0" font-size="12.5">the back-pop loop looks like it could run k times,</text>
  <text x="510" y="136" fill="#e2e8f0" font-size="12.5">but every index is pushed exactly once and popped</text>
  <text x="510" y="154" fill="#e2e8f0" font-size="12.5">at most once over the entire sweep</text>

  <text x="510" y="188" fill="#34d399" font-size="12.5" font-weight="bold">total pops &#8804; total pushes = n &#8658; O(n) overall,</text>
  <text x="510" y="208" fill="#34d399" font-size="12.5" font-weight="bold">O(1) amortized per step, and the front is the</text>
  <text x="510" y="228" fill="#34d399" font-size="12.5" font-weight="bold">window maximum, readable once right &#8805; k - 1</text>

  <text x="510" y="262" fill="#f59e0b" font-size="12">order is fixed: back-pop the dominated, push, then</text>
  <text x="510" y="280" fill="#f59e0b" font-size="12">front-pop the expired, then read the front</text>

  <text x="510" y="310" fill="#f87171" font-size="12">a heap answers the same queries in O(n log n) but</text>
  <text x="510" y="328" fill="#f87171" font-size="12">cannot evict an aged-out max without lazy deletion</text>
</svg>
