<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">DIGIT DP: THE TIGHT FLAG IS WHY ONLY LOOSE STATES CACHE</text>

  <text x="46" y="84" fill="#94a3b8" font-size="12">N =</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="96"  y="62" width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="124" y="85" fill="#a5b4fc">5</text>
    <rect x="180" y="62" width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="208" y="85" fill="#a5b4fc">2</text>
    <rect x="264" y="62" width="56" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/><text x="292" y="85" fill="#a5b4fc">7</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#64748b">
    <text x="124" y="112">pos 0</text>
    <text x="208" y="112">pos 1</text>
    <text x="292" y="112">pos 2</text>
  </g>

  <line x1="154" y1="155" x2="176" y2="155" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <line x1="238" y1="155" x2="260" y2="155" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <line x1="124" y1="172" x2="200" y2="210" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <line x1="208" y1="172" x2="284" y2="210" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <line x1="238" y1="229" x2="260" y2="229" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>

  <text x="100" y="200" fill="#34d399" font-size="10.5" font-weight="bold">d &lt; 5</text>
  <text x="184" y="200" fill="#34d399" font-size="10.5" font-weight="bold">d &lt; 2</text>

  <g font-size="11.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="96"  y="140" width="56" height="30" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="124" y="160" fill="#0f172a">d &#8804; 5</text>
    <rect x="180" y="140" width="56" height="30" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="208" y="160" fill="#0f172a">d &#8804; 2</text>
    <rect x="264" y="140" width="56" height="30" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="292" y="160" fill="#0f172a">d &#8804; 7</text>

    <rect x="180" y="214" width="56" height="30" rx="6" fill="#1e3a8a" stroke="#34d399"/><text x="208" y="234" fill="#34d399">d &#8804; 9</text>
    <rect x="264" y="214" width="56" height="30" rx="6" fill="#1e3a8a" stroke="#34d399"/><text x="292" y="234" fill="#34d399">d &#8804; 9</text>
  </g>

  <text x="340" y="160" fill="#f59e0b" font-size="11" font-weight="bold">TIGHT</text>
  <text x="340" y="176" fill="#94a3b8" font-size="10.5">bound still binding</text>
  <text x="340" y="234" fill="#34d399" font-size="11" font-weight="bold">LOOSE</text>
  <text x="340" y="250" fill="#94a3b8" font-size="10.5">bound irrelevant</text>

  <text x="40" y="284" fill="#f59e0b" font-size="12" font-weight="bold">at most ONE tight state per position &#8212; it is N's own prefix</text>
  <text x="40" y="304" fill="#34d399" font-size="12" font-weight="bold">one digit under the bound and the ceiling is 9 forever after</text>
  <text x="40" y="324" fill="#94a3b8" font-size="11.5">so all loose branches merge into one (pos, property) subproblem</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">10^18 candidates, ~19 positions. build the number one</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">decimal digit at a time, most significant first, carrying</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">(pos, tight, started, property so far)</text>

  <text x="510" y="160" fill="#f59e0b" font-size="12.5" font-weight="bold">the set of numbers &#8804; N splits on WHEN you first drop</text>
  <text x="510" y="180" fill="#f59e0b" font-size="12.5" font-weight="bold">below its prefix; after that every suffix is legal, so</text>
  <text x="510" y="200" fill="#f59e0b" font-size="12.5" font-weight="bold">all of them share one cacheable subproblem</text>

  <text x="510" y="232" fill="#f87171" font-size="12">NEVER memoize a tight state: its digit range is capped, so</text>
  <text x="510" y="250" fill="#f87171" font-size="12">it is not the same subproblem as the loose one with equal</text>
  <text x="510" y="268" fill="#f87171" font-size="12">(pos, property) &#8212; cache only when !tight, or index by it</text>

  <text x="510" y="300" fill="#34d399" font-size="12.5" font-weight="bold">started = &#8220;the zeros so far were padding, not digits&#8221; &#8212;</text>
  <text x="510" y="320" fill="#34d399" font-size="12.5" font-weight="bold">without it 0007 pollutes adjacency and digit-sum rules</text>

  <text x="510" y="346" fill="#64748b" font-size="11.5">answer a range by subtraction: f(R) - f(L - 1)</text>
</svg>
