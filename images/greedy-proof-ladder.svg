<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">PROVE IT OR CLIMB THE LADDER &#8212; THE GREEDY DECISION PROCEDURE</text>

  <rect x="40" y="70" width="250" height="30" rx="6" fill="#312e81" stroke="#6366f1"/>
  <text x="165" y="90" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">candidate greedy rule</text>
  <line x1="165" y1="100" x2="165" y2="116" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arSlate)"/>

  <rect x="40" y="118" width="250" height="32" rx="6" fill="#f59e0b" stroke="#fbbf24"/>
  <text x="165" y="139" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">60-second counterexample hunt</text>
  <line x1="165" y1="150" x2="165" y2="170" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <text x="174" y="166" fill="#34d399" font-size="11">survives</text>

  <rect x="40" y="172" width="250" height="30" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="165" y="192" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">exchange: swap OPT's choice for mine</text>
  <line x1="165" y1="202" x2="165" y2="218" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arSlate)"/>

  <rect x="40" y="220" width="250" height="30" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="165" y="240" fill="#c4b5fd" font-size="12" font-weight="bold" text-anchor="middle">staying ahead: one number dominates</text>
  <line x1="165" y1="250" x2="165" y2="268" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>

  <rect x="40" y="270" width="250" height="30" rx="6" fill="none" stroke="#34d399"/>
  <text x="165" y="290" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">two sentences &#8658; ship it, then code</text>

  <line x1="292" y1="134" x2="308" y2="134" stroke="#f87171" stroke-width="2.5" marker-end="url(#arRed)"/>
  <line x1="292" y1="235" x2="308" y2="222" stroke="#f87171" stroke-width="2.5" marker-end="url(#arRed)"/>

  <rect x="312" y="118" width="158" height="32" rx="6" fill="none" stroke="#f87171"/>
  <text x="391" y="139" fill="#f87171" font-size="11.5" font-weight="bold" text-anchor="middle">killed &#8212; do not code it</text>
  <line x1="391" y1="150" x2="391" y2="176" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arSlate)"/>

  <rect x="312" y="178" width="158" height="32" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="391" y="199" fill="#c4b5fd" font-size="11.5" font-weight="bold" text-anchor="middle">rung 2: regret heap (P8)</text>
  <line x1="391" y1="210" x2="391" y2="236" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arSlate)"/>

  <rect x="312" y="238" width="158" height="32" rx="6" fill="#312e81" stroke="#6366f1"/>
  <text x="391" y="259" fill="#a5b4fc" font-size="11.5" font-weight="bold" text-anchor="middle">rung 3: full DP</text>

  <text x="40" y="326" fill="#94a3b8" font-size="11.5">the ladder is what turns &#8220;my greedy broke&#8221; from a dead end into a pivot</text>

  <text x="510" y="90" fill="#e2e8f0" font-size="12.5">the proof is the deliverable; the code is clerical</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">exchange covers ~70%, staying-ahead ~25% of problems</text>
  <text x="510" y="140" fill="#93c5fd" font-size="12.5" font-weight="bold">exchange &#8212; swap OPT's differing choice for greedy's:</text>
  <text x="510" y="158" fill="#94a3b8" font-size="12">still feasible, no worse; repeat until OPT = greedy</text>
  <text x="510" y="190" fill="#c4b5fd" font-size="12.5" font-weight="bold">staying ahead &#8212; one number that dominates every</text>
  <text x="510" y="208" fill="#94a3b8" font-size="12">rival strategy after i steps: reach, miss, freeAt</text>
  <text x="510" y="240" fill="#f59e0b" font-size="12.5">killing your own rule costs 60 seconds; letting the</text>
  <text x="510" y="258" fill="#f59e0b" font-size="12.5">interviewer kill it costs the round</text>
  <text x="510" y="290" fill="#f87171" font-size="12">no two-sentence argument &#8658; the structure is not</text>
  <text x="510" y="308" fill="#f87171" font-size="12">there: add an undo heap, then fall back to DP</text>
  <text x="510" y="326" fill="#64748b" font-size="12">coin change {1,3,4} for 6 is the standard graveyard</text>
</svg>
