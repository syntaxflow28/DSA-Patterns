<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="320" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">SEARCH THE ANSWER, NOT THE ARRAY &#8212; A FEASIBILITY AXIS</text>

  <text x="249" y="100" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">first T = the optimum</text>

  <rect x="50" y="118" width="192" height="36" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="146" y="141" fill="#f87171" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">F F F F F F</text>

  <rect x="244" y="112" width="10" height="48" rx="3" fill="#f59e0b"/>

  <rect x="256" y="118" width="194" height="36" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="353" y="141" fill="#c4b5fd" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">T T T T T T</text>

  <line x1="50" y1="158" x2="50" y2="170" stroke="#64748b" stroke-width="1.5"/>
  <line x1="450" y1="158" x2="450" y2="170" stroke="#64748b" stroke-width="1.5"/>
  <text x="44" y="186" fill="#94a3b8" font-size="11.5">lo &#8212; smallest MEANINGFUL candidate</text>
  <text x="456" y="186" fill="#94a3b8" font-size="11.5" text-anchor="end">hi &#8212; provably feasible</text>

  <text x="40" y="218" fill="#34d399" font-size="12.5" font-weight="bold">feasible(mid) &#8658; hi = mid &#183; mid may BE the answer</text>
  <text x="40" y="240" fill="#f87171" font-size="12.5" font-weight="bold">not feasible &#8658; lo = mid + 1 &#183; mid is certified dead</text>

  <text x="40" y="272" fill="#f59e0b" font-size="12">the mirror shape T T T F F F is last-true: lo = mid,</text>
  <text x="40" y="290" fill="#f59e0b" font-size="12">and then the midpoint MUST round up</text>

  <text x="510" y="90" fill="#e2e8f0" font-size="12.5">the axis holds candidate answers &#8212; speeds, capacities,</text>
  <text x="510" y="110" fill="#e2e8f0" font-size="12.5">days, gaps &#8212; and never array positions</text>

  <text x="510" y="148" fill="#34d399" font-size="12.5" font-weight="bold">monotonicity needs a one-sentence structural reason:</text>
  <text x="510" y="166" fill="#34d399" font-size="12.5" font-weight="bold">&#8220;faster never hurts &#8212; the same schedule just finishes</text>
  <text x="510" y="184" fill="#34d399" font-size="12.5" font-weight="bold">sooner.&#8221; No sentence, no binary search.</text>

  <text x="510" y="222" fill="#f59e0b" font-size="12">one hard optimization becomes log R easy decisions;</text>
  <text x="510" y="240" fill="#f59e0b" font-size="12">total cost O(log R &#183; C), C = one greedy check</text>

  <text x="510" y="276" fill="#f87171" font-size="12">bad bounds are the #1 killer &#8212; below the true lo the</text>
  <text x="510" y="294" fill="#f87171" font-size="12">check misbehaves silently and the wrong answer looks</text>
  <text x="510" y="312" fill="#f87171" font-size="12">exactly like an off-by-one in the loop</text>
</svg>
