<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
    <marker id="arRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9a8d4"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">READ / WRITE POINTERS: THE GAP IS THE DISCARD COUNT</text>

  <text x="40" y="70" fill="#94a3b8" font-size="11.5">dedup of 1 1 2 2 3 &#183; two elements dropped so far</text>
  <text x="192" y="88" fill="#f472b6" font-size="11.5" font-weight="bold" text-anchor="middle">slow (write)</text>
  <text x="316" y="88" fill="#f9a8d4" font-size="11.5" font-weight="bold" text-anchor="middle">fast (read)</text>
  <line x1="192" y1="94" x2="192" y2="108" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="316" y1="94" x2="316" y2="108" stroke="#f9a8d4" stroke-width="2.5" marker-end="url(#arRose)"/>

  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="112" width="56" height="34" rx="6" fill="#065f46" stroke="#34d399"/><text x="68"  y="134" fill="#6ee7b7">1</text>
    <rect x="102" y="112" width="56" height="34" rx="6" fill="#065f46" stroke="#34d399"/><text x="130" y="134" fill="#6ee7b7">2</text>
    <rect x="164" y="112" width="56" height="34" rx="6" fill="#1e293b" stroke="#334155"/><text x="192" y="134" fill="#475569">2</text>
    <rect x="226" y="112" width="56" height="34" rx="6" fill="#1e293b" stroke="#334155"/><text x="254" y="134" fill="#475569">2</text>
    <rect x="288" y="112" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="316" y="134" fill="#93c5fd">3</text>
  </g>

  <g stroke="#34d399" stroke-width="1.6">
    <line x1="40" y1="156" x2="158" y2="156"/>
    <line x1="40" y1="152" x2="40" y2="160"/>
    <line x1="158" y1="152" x2="158" y2="160"/>
  </g>
  <g stroke="#64748b" stroke-width="1.6">
    <line x1="164" y1="156" x2="282" y2="156"/>
    <line x1="164" y1="152" x2="164" y2="160"/>
    <line x1="282" y1="152" x2="282" y2="160"/>
  </g>
  <text x="99"  y="176" fill="#34d399" font-size="11.5" text-anchor="middle">[0, slow) finished</text>
  <text x="223" y="176" fill="#64748b" font-size="11.5" text-anchor="middle">stale, already read</text>

  <text x="40" y="208" fill="#f59e0b" font-size="12.5" font-weight="bold">fast - slow = 2 = exactly the number of elements dropped</text>
  <text x="40" y="238" fill="#34d399" font-size="12.5" font-weight="bold">slow &#8804; fast at all times, so the writer only ever</text>
  <text x="40" y="256" fill="#34d399" font-size="12.5" font-weight="bold">overwrites cells the reader has already consumed</text>
  <text x="40" y="282" fill="#64748b" font-size="11.5">that single inequality is the whole licence to build the</text>
  <text x="40" y="298" fill="#64748b" font-size="11.5">output inside the input buffer, with zero extra memory</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">fast is the READER &#8212; it visits every cell exactly once,</text>
  <text x="510" y="106" fill="#e2e8f0" font-size="12.5">left to right, and never looks back</text>
  <text x="510" y="130" fill="#e2e8f0" font-size="12.5">slow is the WRITER &#8212; it marks where the next kept</text>
  <text x="510" y="148" fill="#e2e8f0" font-size="12.5">element belongs</text>

  <text x="510" y="182" fill="#f59e0b" font-size="12.5">keep &#8658; copy to slow, then advance both</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5">drop &#8658; advance fast alone, the gap widens by one</text>

  <text x="510" y="236" fill="#34d399" font-size="12.5" font-weight="bold">invariant: [0, slow) is the finished answer for</text>
  <text x="510" y="256" fill="#34d399" font-size="12.5" font-weight="bold">the prefix [0, fast) of the input &#8658; O(n), O(1)</text>

  <text x="510" y="290" fill="#f87171" font-size="12">slow ends as the LENGTH of the result, not the index</text>
  <text x="510" y="308" fill="#f87171" font-size="12">of the last kept element &#8212; slow - 1 is the classic bug</text>
</svg>
