<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">ROUTING &#8212; NAME THE SEARCH DOMAIN AND THE PATTERN FALLS OUT</text>

  <text x="148" y="72" fill="#64748b" font-size="11" text-anchor="middle">WHAT YOU SEARCH OVER</text>
  <text x="375" y="72" fill="#64748b" font-size="11" text-anchor="middle">PATTERN</text>

  <rect x="40" y="85"  width="215" height="40" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="148" y="110" fill="#93c5fd" font-size="12.5" text-anchor="middle">array indices, order guaranteed</text>
  <line x1="258" y1="105" x2="294" y2="105" stroke="#64748b" stroke-width="2.5" marker-end="url(#arDim)"/>
  <rect x="300" y="88" width="150" height="34" rx="6" fill="#312e81" stroke="#a78bfa"/>
  <text x="375" y="110" fill="#a5b4fc" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">1 &#183; 2 &#183; 3 &#183; 4</text>

  <rect x="40" y="140" width="215" height="40" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="148" y="165" fill="#c4b5fd" font-size="12.5" text-anchor="middle">candidate answer values</text>
  <line x1="258" y1="160" x2="294" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arDim)"/>
  <rect x="300" y="143" width="150" height="34" rx="6" fill="#312e81" stroke="#a78bfa"/>
  <text x="375" y="165" fill="#a5b4fc" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">5 &#183; 6 &#183; 7</text>

  <rect x="40" y="195" width="215" height="40" rx="6" fill="#312e81" stroke="#a5b4fc"/>
  <text x="148" y="220" fill="#a5b4fc" font-size="12.5" text-anchor="middle">a matrix with sort guarantees</text>
  <line x1="258" y1="215" x2="294" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arDim)"/>
  <rect x="300" y="198" width="150" height="34" rx="6" fill="#312e81" stroke="#a78bfa"/>
  <text x="375" y="220" fill="#a5b4fc" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">8</text>

  <rect x="40" y="250" width="215" height="40" rx="6" fill="#f59e0b" stroke="#f59e0b"/>
  <text x="148" y="275" fill="#0f172a" font-size="12.5" font-weight="bold" text-anchor="middle">unknown size, no usable bound</text>
  <line x1="258" y1="270" x2="294" y2="270" stroke="#64748b" stroke-width="2.5" marker-end="url(#arDim)"/>
  <rect x="300" y="253" width="150" height="34" rx="6" fill="#312e81" stroke="#a78bfa"/>
  <text x="375" y="275" fill="#a5b4fc" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">9</text>

  <rect x="40" y="305" width="215" height="40" rx="6" fill="#1e293b" stroke="#34d399"/>
  <text x="148" y="330" fill="#34d399" font-size="12.5" text-anchor="middle">a split across two sorted arrays</text>
  <line x1="258" y1="325" x2="294" y2="325" stroke="#64748b" stroke-width="2.5" marker-end="url(#arDim)"/>
  <rect x="300" y="308" width="150" height="34" rx="6" fill="#312e81" stroke="#a78bfa"/>
  <text x="375" y="330" fill="#a5b4fc" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">10</text>

  <text x="510" y="95" fill="#e2e8f0" font-size="12.5">the input's shape is only a hint; the domain you</text>
  <text x="510" y="115" fill="#e2e8f0" font-size="12.5">choose is the decision &#8212; the loop after it is boilerplate</text>

  <text x="510" y="152" fill="#f59e0b" font-size="12.5" font-weight="bold">&#8220;minimize the maximum&#8221; / &#8220;maximize the minimum&#8221;</text>
  <text x="510" y="170" fill="#f59e0b" font-size="12.5" font-weight="bold">&#8658; you are searching answers, never array cells</text>

  <text x="510" y="207" fill="#94a3b8" font-size="12">n &#8804; 10^5 with values up to 10^9: iterating values is</text>
  <text x="510" y="225" fill="#94a3b8" font-size="12">dead, but ~30 probes over the value range is free &#8212;</text>
  <text x="510" y="243" fill="#94a3b8" font-size="12">constraints are the interviewer confessing the pattern</text>

  <text x="510" y="280" fill="#34d399" font-size="12.5" font-weight="bold">easy to VERIFY a candidate, hard to CONSTRUCT one:</text>
  <text x="510" y="298" fill="#34d399" font-size="12.5" font-weight="bold">that asymmetry is exactly what binary search eats</text>

  <text x="510" y="334" fill="#f87171" font-size="12">no monotone predicate &#8658; no binary search, no matter</text>
  <text x="510" y="352" fill="#f87171" font-size="12">how sorted the data looks</text>
</svg>
