<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">FIXED WINDOW: ONE STEP COSTS TWO UPDATES</text>

  <text x="328" y="76" fill="#f59e0b" font-size="11" font-weight="bold">enters</text>
  <line x1="316" y1="62" x2="316" y2="84" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>

  <path d="M 40 78 L 40 70 L 276 70 L 276 78" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="158" y="62" fill="#94a3b8" font-size="11.5" text-anchor="middle">previous window, size k</text>

  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="90" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#f472b6"/><text x="68"  y="112" fill="#f9a8d4">4</text>
    <rect x="102" y="90" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="130" y="112" fill="#93c5fd">2</text>
    <rect x="164" y="90" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="192" y="112" fill="#93c5fd">7</text>
    <rect x="226" y="90" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="254" y="112" fill="#93c5fd">1</text>
    <rect x="288" y="90" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="316" y="112" fill="#0f172a">8</text>
    <rect x="350" y="90" width="56" height="34" rx="6" fill="none"    stroke="#334155"/><text x="378" y="112" fill="#64748b">3</text>
  </g>

  <line x1="68" y1="126" x2="68" y2="150" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <text x="68" y="166" fill="#f9a8d4" font-size="11.5" font-weight="bold" text-anchor="middle">leaves</text>
  <text x="68" y="182" fill="#94a3b8" font-size="11" text-anchor="middle">nums[right - k]</text>

  <path d="M 102 132 L 102 140 L 338 140 L 338 132" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="158" fill="#f59e0b" font-size="11.5" font-weight="bold" text-anchor="middle">next window, size k</text>
  <text x="220" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">k - 1 cells are shared and never re-read</text>

  <text x="40" y="214" fill="#a5b4fc" font-size="12.5" font-family="Consolas, monospace">state(right) = state(right-1) + nums[right] - nums[right-k]</text>

  <text x="40" y="248" fill="#34d399" font-size="12.5" font-weight="bold">the slide computes a DIFFERENCE, not a window</text>
  <text x="40" y="270" fill="#34d399" font-size="12.5" font-weight="bold">O(1) per step &#8658; O(n) total, never O(nk)</text>

  <text x="510" y="88" fill="#e2e8f0" font-size="13" font-weight="bold">why the overlap is the whole trick</text>
  <text x="510" y="118" fill="#e2e8f0" font-size="12.5">consecutive windows of size k agree on k - 1 of</text>
  <text x="510" y="136" fill="#e2e8f0" font-size="12.5">their elements; recomputing from scratch redoes</text>
  <text x="510" y="154" fill="#e2e8f0" font-size="12.5">almost all of that work for nothing</text>
  <text x="510" y="178" fill="#e2e8f0" font-size="12.5">exactly two things changed &#8212; one arrival and one</text>
  <text x="510" y="196" fill="#e2e8f0" font-size="12.5">departure &#8212; so exactly two updates are owed</text>

  <text x="510" y="230" fill="#34d399" font-size="12.5" font-weight="bold">every element is touched twice in the whole run:</text>
  <text x="510" y="250" fill="#34d399" font-size="12.5" font-weight="bold">once entering, once leaving &#8212; the seed of every</text>
  <text x="510" y="270" fill="#34d399" font-size="12.5" font-weight="bold">amortized argument that follows</text>

  <text x="510" y="300" fill="#f87171" font-size="12">the window is full only at right &#8805; k - 1, and dropping</text>
  <text x="510" y="318" fill="#f87171" font-size="12">the removal leaves a state that can only ever grow</text>
</svg>
