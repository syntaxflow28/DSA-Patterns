<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">DUTCH NATIONAL FLAG: FOUR REGIONS, THREE DISPATCH RULES</text>

  <text x="140" y="76" fill="#f472b6" font-size="11.5" font-weight="bold" text-anchor="middle">low</text>
  <text x="230" y="76" fill="#f472b6" font-size="11.5" font-weight="bold" text-anchor="middle">mid</text>
  <text x="344" y="76" fill="#f472b6" font-size="11.5" font-weight="bold" text-anchor="middle">high</text>
  <line x1="140" y1="82" x2="140" y2="96" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="230" y1="82" x2="230" y2="96" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="344" y1="82" x2="344" y2="96" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>

  <g font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="100" width="100" height="36" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="90"  y="123" fill="#93c5fd">0 0 0</text>
    <rect x="140" y="100" width="90"  height="36" rx="6" fill="#312e81" stroke="#6366f1"/><text x="185" y="123" fill="#a5b4fc">1 1</text>
    <rect x="230" y="100" width="120" height="36" rx="6" fill="#1e293b" stroke="#475569"/><text x="290" y="123" fill="#94a3b8">? ? ?</text>
    <rect x="350" y="100" width="90"  height="36" rx="6" fill="#7f1d1d" stroke="#f87171"/><text x="395" y="123" fill="#fca5a5">2 2</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#64748b">
    <text x="90"  y="154">zeros</text>
    <text x="185" y="154">ones</text>
    <text x="290" y="154">unclassified</text>
    <text x="395" y="154">twos</text>
  </g>

  <text x="40" y="190" fill="#e2e8f0" font-size="12.5" font-weight="bold">dispatch on nums[mid]</text>
  <text x="40" y="216" fill="#93c5fd" font-size="12.5" font-weight="bold">0 &#8658; swap(low, mid); low++, mid++</text>
  <text x="56" y="234" fill="#64748b" font-size="11.5">what comes back is a known 1 &#8212; already classified</text>
  <text x="40" y="262" fill="#a5b4fc" font-size="12.5" font-weight="bold">1 &#8658; mid++ only; it is already home</text>
  <text x="40" y="292" fill="#f87171" font-size="12.5" font-weight="bold">2 &#8658; swap(mid, high); high--, and mid STAYS PUT</text>
  <text x="56" y="310" fill="#f87171" font-size="11.5">what comes back arrived from the unclassified region</text>
  <text x="56" y="328" fill="#f87171" font-size="11.5">&#8212; nobody has looked at it, so mid must re-examine it</text>

  <text x="510" y="88" fill="#e2e8f0" font-size="13" font-weight="bold">the four invariants, true after EVERY operation:</text>
  <g font-size="13" font-family="Consolas, monospace">
    <text x="510" y="120" fill="#93c5fd">[0, low)      all 0s</text>
    <text x="510" y="144" fill="#a5b4fc">[low, mid)    all 1s</text>
    <text x="510" y="168" fill="#94a3b8">[mid, high]   unclassified</text>
    <text x="510" y="192" fill="#fca5a5">(high, n)     all 2s</text>
  </g>

  <text x="510" y="228" fill="#34d399" font-size="12.5" font-weight="bold">when mid passes high the unclassified region is</text>
  <text x="510" y="248" fill="#34d399" font-size="12.5" font-weight="bold">empty, and the invariants ARE the proof that the</text>
  <text x="510" y="268" fill="#34d399" font-size="12.5" font-weight="bold">array is sorted &#8212; one pass, O(1) space</text>

  <text x="510" y="302" fill="#f59e0b" font-size="12.5">loop guard is mid &#8804; high, not mid &lt; high: the last</text>
  <text x="510" y="320" fill="#f59e0b" font-size="12.5">unclassified cell sits AT high</text>
  <text x="510" y="344" fill="#64748b" font-size="11.5">the same invariant-first argument proves quickselect's partition</text>
</svg>
