<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="300" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">EARLIEST END FIRST &#8212; THE FUTURE ONLY SEES WHEN YOU ARE FREE</text>

  <rect x="60" y="74" width="342" height="24" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="231" y="91" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">A = [1, 10]</text>

  <rect x="98" y="106" width="38" height="24" rx="6" fill="#f59e0b" stroke="#fbbf24"/>
  <text x="117" y="123" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">B</text>
  <rect x="174" y="106" width="38" height="24" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="193" y="123" fill="#c4b5fd" font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">C</text>
  <text x="224" y="123" fill="#94a3b8" font-size="11.5">B = [2, 3]&#160;&#160;&#183;&#160;&#160;C = [4, 5]</text>

  <line x1="52" y1="146" x2="416" y2="146" stroke="#64748b" stroke-width="1.2"/>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="60"  y1="142" x2="60"  y2="150"/>
    <line x1="98"  y1="142" x2="98"  y2="150"/>
    <line x1="136" y1="142" x2="136" y2="150"/>
    <line x1="174" y1="142" x2="174" y2="150"/>
    <line x1="212" y1="142" x2="212" y2="150"/>
    <line x1="250" y1="142" x2="250" y2="150"/>
    <line x1="288" y1="142" x2="288" y2="150"/>
    <line x1="326" y1="142" x2="326" y2="150"/>
    <line x1="364" y1="142" x2="364" y2="150"/>
    <line x1="402" y1="142" x2="402" y2="150"/>
  </g>
  <g fill="#64748b" font-size="10.5" text-anchor="middle" font-family="Consolas, monospace">
    <text x="60"  y="166">1</text>
    <text x="98"  y="166">2</text>
    <text x="136" y="166">3</text>
    <text x="174" y="166">4</text>
    <text x="212" y="166">5</text>
    <text x="250" y="166">6</text>
    <text x="288" y="166">7</text>
    <text x="326" y="166">8</text>
    <text x="364" y="166">9</text>
    <text x="402" y="166">10</text>
  </g>

  <text x="40" y="204" fill="#f87171" font-size="12.5" font-weight="bold">sort by START &#8594; take A, busy until 10, B and C blocked</text>
  <text x="40" y="222" fill="#f87171" font-size="12">kept 1</text>
  <text x="40" y="252" fill="#34d399" font-size="12.5" font-weight="bold">sort by END &#8594; take B, free at 3, C still fits, free at 5</text>
  <text x="40" y="270" fill="#34d399" font-size="12">kept 2</text>

  <text x="510" y="84" fill="#e2e8f0" font-size="12.5">nothing downstream cares how long an interval was &#8212;</text>
  <text x="510" y="102" fill="#e2e8f0" font-size="12.5">it only cares WHEN YOU BECOME FREE, so the end time</text>
  <text x="510" y="120" fill="#e2e8f0" font-size="12.5">is the only field the sort key may be built from</text>
  <text x="510" y="152" fill="#34d399" font-size="12.5" font-weight="bold">exchange: replace OPT's first interval with the</text>
  <text x="510" y="170" fill="#34d399" font-size="12.5" font-weight="bold">earliest-ending e &#8212; e ends no later, so everything</text>
  <text x="510" y="188" fill="#34d399" font-size="12.5" font-weight="bold">after OPT kept still fits: same count, still feasible</text>
  <text x="510" y="220" fill="#f87171" font-size="12">sorting by start is the family's silent failure, and</text>
  <text x="510" y="238" fill="#f87171" font-size="12">weights on intervals (1235) void the theorem &#8212; DP</text>
  <text x="510" y="266" fill="#64748b" font-size="12">touching ends: 435 treats [1,3] and [3,5] as fine,</text>
  <text x="510" y="284" fill="#64748b" font-size="12">452 shares one arrow &#8212; read the rule, never assume</text>
</svg>
