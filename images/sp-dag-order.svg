<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="350" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">DAG: TOPOLOGICAL ORDER IS A FREE, PERFECT ORDERING</text>

  <text x="60" y="96" fill="#34d399" font-size="11.5" font-weight="bold">one sweep, left to right &#8212; no heap, no repeated passes</text>
  <line x1="60" y1="110" x2="452" y2="110" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arGreen)"/>

  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="80"  y="134">topo 1</text>
    <text x="200" y="134">topo 2</text>
    <text x="320" y="134">topo 3</text>
    <text x="440" y="134">topo 4</text>
  </g>

  <line x1="102" y1="160" x2="174" y2="160" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="222" y1="160" x2="294" y2="160" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="342" y1="160" x2="414" y2="160" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <path d="M 96 178 C 150 245 260 245 304 178" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <path d="M 216 178 C 285 285 375 285 424 180" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arPurple)"/>

  <circle cx="80"  cy="160" r="22" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="200" cy="160" r="22" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="320" cy="160" r="22" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="440" cy="160" r="22" fill="#1e3a8a" stroke="#3b82f6"/>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#93c5fd">
    <text x="80"  y="166">A</text>
    <text x="200" y="166">B</text>
    <text x="320" y="166">C</text>
    <text x="440" y="166">D</text>
  </g>

  <g font-size="11.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <text x="138" y="151" fill="#93c5fd">3</text>
    <text x="258" y="151" fill="#93c5fd">4</text>
    <text x="378" y="151" fill="#93c5fd">1</text>
    <text x="320" y="278" fill="#c4b5fd">7</text>
  </g>
  <text x="180" y="248" fill="#f59e0b" font-size="11" text-anchor="middle">-2 &#8212; negative, and harmless</text>

  <text x="40" y="306" fill="#34d399" font-size="12.5" font-weight="bold">by the time C is processed both of its predecessors are already final</text>
  <text x="40" y="332" fill="#f59e0b" font-size="12.5" font-weight="bold">flip min to max in the very same sweep &#8658; longest path, still O(V + E)</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">every ordering trick in this guide exists to make</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">dist[u] final before u's edges are relaxed. A DAG</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">gives that structurally: every arrow points forward</text>
  <text x="510" y="148" fill="#e2e8f0" font-size="12.5">in the order, so no node is ever revisited</text>

  <text x="510" y="182" fill="#f59e0b" font-size="12.5" font-weight="bold">negative weights need no special handling here &#8212;</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5" font-weight="bold">the argument never mentions the sign, only the order</text>

  <text x="510" y="236" fill="#34d399" font-size="12.5" font-weight="bold">longest simple path is NP-hard only because cycles</text>
  <text x="510" y="256" fill="#34d399" font-size="12.5" font-weight="bold">force you to avoid revisits; with no cycles the</text>
  <text x="510" y="276" fill="#34d399" font-size="12.5" font-weight="bold">hardness evaporates &#8212; that is why CPM works</text>

  <text x="510" y="310" fill="#f87171" font-size="12">check Kahn popped all n nodes first: on a cyclic graph the</text>
  <text x="510" y="328" fill="#f87171" font-size="12">&#8220;order&#8221; is partial and the sweep silently undercounts</text></svg>
