<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">TRIE: SHARED PREFIXES ARE SHARED PATHS</text>

  <text x="180" y="66" fill="#64748b" font-size="11" text-anchor="middle">root</text>

  <line x1="168" y1="100" x2="127" y2="138" stroke="#a78bfa" stroke-width="3"/>
  <line x1="115" y1="166" x2="115" y2="196" stroke="#a78bfa" stroke-width="3"/>
  <line x1="192" y1="100" x2="278" y2="138" stroke="#3b82f6" stroke-width="2"/>
  <line x1="104" y1="226" x2="82"  y2="260" stroke="#3b82f6" stroke-width="2"/>
  <line x1="126" y1="226" x2="148" y2="260" stroke="#3b82f6" stroke-width="2"/>
  <line x1="290" y1="166" x2="290" y2="196" stroke="#3b82f6" stroke-width="2"/>
  <line x1="290" y1="228" x2="290" y2="258" stroke="#3b82f6" stroke-width="2"/>

  <g font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <circle cx="180" cy="86"  r="15" fill="#1e293b" stroke="#64748b"/>
    <circle cx="115" cy="151" r="15" fill="#4c1d95" stroke="#a78bfa"/><text x="115" y="156" fill="#c4b5fd">c</text>
    <circle cx="290" cy="151" r="15" fill="#4c1d95" stroke="#a78bfa"/><text x="290" y="156" fill="#c4b5fd">d</text>
    <circle cx="115" cy="211" r="15" fill="#4c1d95" stroke="#a78bfa"/><text x="115" y="216" fill="#c4b5fd">a</text>
    <circle cx="290" cy="211" r="15" fill="#f59e0b" stroke="#f59e0b"/><text x="290" y="216" fill="#0f172a">o</text>
    <circle cx="70"  cy="275" r="15" fill="#1e3a8a" stroke="#34d399" stroke-width="2.5"/><text x="70"  y="280" fill="#93c5fd">r</text>
    <circle cx="160" cy="275" r="15" fill="#1e3a8a" stroke="#34d399" stroke-width="2.5"/><text x="160" y="280" fill="#93c5fd">t</text>
    <circle cx="290" cy="275" r="15" fill="#1e3a8a" stroke="#34d399" stroke-width="2.5"/><text x="290" y="280" fill="#93c5fd">g</text>
  </g>

  <g font-size="11" fill="#94a3b8" font-family="Consolas, monospace">
    <text x="142" y="118">c</text>
    <text x="238" y="118">d</text>
    <text x="128" y="186">a</text>
    <text x="76"  y="248">r</text>
    <text x="150" y="248">t</text>
    <text x="302" y="186">o</text>
    <text x="302" y="248">g</text>
  </g>

  <text x="380" y="112" fill="#94a3b8" font-size="11.5">stored words:</text>
  <text x="380" y="134" fill="#e2e8f0" font-size="12" font-family="Consolas, monospace">car cat do dog</text>

  <text x="40"  y="316" fill="#34d399" font-size="11.5">green ring = isWord</text>
  <text x="200" y="316" fill="#f59e0b" font-size="11.5">amber = a word that is also a prefix (do &#183; dog)</text>
  <text x="40"  y="340" fill="#c4b5fd" font-size="11.5">car and cat share the path root &#8594; c &#8594; a &#8212; stored once</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">a hash set answers &#8220;is this exact word present?&#8221;</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">but is structurally blind to prefixes: it must scan</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">every key to answer &#8220;does anything start with ca?&#8221;</text>

  <text x="510" y="162" fill="#34d399" font-size="12.5" font-weight="bold">the trie makes the sharing physical &#8212; one node per</text>
  <text x="510" y="182" fill="#34d399" font-size="12.5" font-weight="bold">shared prefix, so a prefix query terminates at a</text>
  <text x="510" y="202" fill="#34d399" font-size="12.5" font-weight="bold">single node in O(L), whatever the dictionary size</text>

  <text x="510" y="236" fill="#f59e0b" font-size="12.5" font-weight="bold">a dead prefix kills every word behind it at once;</text>
  <text x="510" y="256" fill="#f59e0b" font-size="12.5" font-weight="bold">that mass pruning is what makes 212 tractable</text>

  <text x="510" y="290" fill="#f87171" font-size="12">search() and startsWith() differ only in the final</text>
  <text x="510" y="308" fill="#f87171" font-size="12">isWord check &#8212; blur them and exact matches break</text>

  <text x="510" y="338" fill="#64748b" font-size="11.5">26 child pointers per node is real memory; sparse</text>
  <text x="510" y="356" fill="#64748b" font-size="11.5">alphabets want a hashmap of children instead</text>
</svg>
