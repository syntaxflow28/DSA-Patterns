<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">WHAT DP IS: THE CALL TREE THAT COLLAPSES INTO A DAG</text>

  <text x="40" y="66" fill="#94a3b8" font-size="11.5">naive fib(5) &#8212; the same arguments derived again on separate branches</text>

  <line x1="250" y1="112" x2="168" y2="124" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="250" y1="112" x2="337" y2="124" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="160" y1="160" x2="113" y2="172" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <line x1="160" y1="160" x2="207" y2="172" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="345" y1="160" x2="308" y2="172" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <line x1="345" y1="160" x2="382" y2="172" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="105" y1="208" x2="78"  y2="220" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <line x1="105" y1="208" x2="142" y2="220" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>

  <g font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="222" y="78"  width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="250" y="100" fill="#93c5fd">fib 5</text>

    <rect x="132" y="126" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="160" y="148" fill="#93c5fd">fib 4</text>
    <rect x="317" y="126" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="345" y="148" fill="#93c5fd">fib 3</text>

    <rect x="77"  y="174" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="105" y="196" fill="#0f172a">fib 3</text>
    <rect x="187" y="174" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="215" y="196" fill="#93c5fd">fib 2</text>
    <rect x="272" y="174" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="300" y="196" fill="#0f172a">fib 2</text>
    <rect x="362" y="174" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="390" y="196" fill="#93c5fd">fib 1</text>

    <rect x="42"  y="222" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="70"  y="244" fill="#0f172a">fib 2</text>
    <rect x="122" y="222" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="150" y="244" fill="#93c5fd">fib 1</text>
  </g>

  <text x="40" y="274" fill="#94a3b8" font-size="11.5">memoized &#8212; one node per DISTINCT state, every edge a cache hit</text>

  <line x1="180" y1="303" x2="200" y2="303" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <line x1="260" y1="303" x2="280" y2="303" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <line x1="340" y1="303" x2="360" y2="303" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <path d="M 70 320 Q 150 356 226 322"  fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <path d="M 150 320 Q 230 372 306 322" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <path d="M 230 320 Q 310 356 386 322" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>

  <g font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="42"  y="286" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="70"  y="308" fill="#c4b5fd">fib 1</text>
    <rect x="122" y="286" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="150" y="308" fill="#c4b5fd">fib 2</text>
    <rect x="202" y="286" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="230" y="308" fill="#c4b5fd">fib 3</text>
    <rect x="282" y="286" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="310" y="308" fill="#c4b5fd">fib 4</text>
    <rect x="362" y="286" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="390" y="308" fill="#c4b5fd">fib 5</text>
  </g>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">every branch re-derives arguments another branch already</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">solved &#8212; that duplication IS &#8220;overlapping subproblems&#8221;, and</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">it costs O(2^n) calls to produce n distinct answers</text>

  <text x="510" y="160" fill="#f59e0b" font-size="12.5" font-weight="bold">amber = a node whose value already exists elsewhere;</text>
  <text x="510" y="180" fill="#f59e0b" font-size="12.5" font-weight="bold">the share of such nodes grows with every extra level</text>

  <text x="510" y="212" fill="#34d399" font-size="12.5" font-weight="bold">key the answer by its arguments and the tree folds into</text>
  <text x="510" y="232" fill="#34d399" font-size="12.5" font-weight="bold">a DAG: n nodes, O(1) work each &#8658; O(n) total</text>

  <text x="510" y="264" fill="#e2e8f0" font-size="12">top-down memo and bottom-up table are the SAME DAG &#8212; one</text>
  <text x="510" y="282" fill="#e2e8f0" font-size="12">finds the fill order by recursing, the other by looping</text>

  <text x="510" y="314" fill="#f87171" font-size="12">no repeats &#8658; nothing to cache: the DAG equals the tree and</text>
  <text x="510" y="332" fill="#f87171" font-size="12">DP degenerates into plain divide &amp; conquer</text>

  <text x="510" y="360" fill="#64748b" font-size="11.5">count the DAG's nodes first &#8212; that count is the complexity</text>
</svg>
