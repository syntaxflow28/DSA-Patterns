<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">EXPAND FROM CENTER: 2n-1 CENTERS, ONE EXPANSION EACH</text>

  <text x="40" y="76" fill="#94a3b8" font-size="11.5">odd center &#8212; sits ON a character: l = r = i</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="86" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="68"  y="108" fill="#93c5fd">a</text>
    <rect x="102" y="86" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="130" y="108" fill="#93c5fd">b</text>
    <rect x="164" y="86" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="192" y="108" fill="#0f172a">c</text>
    <rect x="226" y="86" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="254" y="108" fill="#93c5fd">b</text>
    <rect x="288" y="86" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="316" y="108" fill="#93c5fd">a</text>
  </g>
  <line x1="186" y1="134" x2="60"  y2="134" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="198" y1="134" x2="324" y2="134" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <text x="120" y="152" fill="#f472b6" font-size="11.5" font-weight="bold" text-anchor="middle">l--</text>
  <text x="264" y="152" fill="#f472b6" font-size="11.5" font-weight="bold" text-anchor="middle">r++</text>

  <text x="40" y="184" fill="#94a3b8" font-size="11.5">even center &#8212; sits IN a gap: l = i, r = i + 1</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="194" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="68"  y="216" fill="#93c5fd">a</text>
    <rect x="102" y="194" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="130" y="216" fill="#93c5fd">b</text>
    <rect x="164" y="194" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="192" y="216" fill="#93c5fd">b</text>
    <rect x="226" y="194" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="254" y="216" fill="#93c5fd">a</text>
  </g>
  <line x1="161" y1="186" x2="161" y2="236" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="155" y1="248" x2="60"  y2="248" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="167" y1="248" x2="262" y2="248" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>

  <text x="40" y="284" fill="#f59e0b" font-size="12.5" font-weight="bold">n characters + (n - 1) gaps = 2n - 1 centers</text>
  <text x="40" y="308" fill="#34d399" font-size="12.5" font-weight="bold">the loop always overshoots by one on each side,</text>
  <text x="40" y="326" fill="#34d399" font-size="12.5" font-weight="bold">so the length is r - l - 1, never r - l + 1</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">a palindrome is defined by symmetry about its center,</text>
  <text x="510" y="106" fill="#e2e8f0" font-size="12.5">and every palindrome has exactly ONE center &#8212; either</text>
  <text x="510" y="124" fill="#e2e8f0" font-size="12.5">a character or the gap between two of them</text>

  <text x="510" y="156" fill="#e2e8f0" font-size="12.5">so enumerate centers, not substrings: O(n) centers</text>
  <text x="510" y="174" fill="#e2e8f0" font-size="12.5">&#215; O(n) growth = O(n&#178;) time and O(1) space, against</text>
  <text x="510" y="192" fill="#e2e8f0" font-size="12.5">O(n&#179;) for testing every substring for symmetry</text>

  <text x="510" y="226" fill="#34d399" font-size="12.5" font-weight="bold">the maximal palindrome at a center CONTAINS</text>
  <text x="510" y="246" fill="#34d399" font-size="12.5" font-weight="bold">every shorter one there, so a single expansion</text>
  <text x="510" y="266" fill="#34d399" font-size="12.5" font-weight="bold">captures all of them &#8212; count or measure as you go</text>

  <text x="510" y="300" fill="#f87171" font-size="12">skipping the even centers &#8212; the expand(s, i, i+1)</text>
  <text x="510" y="318" fill="#f87171" font-size="12">call &#8212; is the #1 bug here: &#8220;abba&#8221; has no character</text>
  <text x="510" y="336" fill="#f87171" font-size="12">sitting at its center</text>
</svg>
