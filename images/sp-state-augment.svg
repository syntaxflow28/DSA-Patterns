<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="350" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">STATE AUGMENTATION: ONE VERTEX BECOMES ONE PER RESOURCE VALUE</text>

  <circle cx="62" cy="190" r="22" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="62" y="196" fill="#93c5fd" font-size="15" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">v</text>
  <text x="62" y="228" fill="#64748b" font-size="10.5" text-anchor="middle">input vertex</text>

  <text x="123" y="180" fill="#34d399" font-size="10.5" text-anchor="middle">expands into</text>
  <line x1="86" y1="190" x2="158" y2="190" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arGreen)"/>

  <line x1="217" y1="172" x2="287" y2="138" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="217" y1="208" x2="287" y2="242" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="332" y1="138" x2="402" y2="172" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>
  <line x1="332" y1="242" x2="402" y2="208" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arPink)"/>

  <circle cx="195" cy="190" r="30" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="310" cy="120" r="30" fill="#4c1d95" stroke="#a78bfa"/>
  <circle cx="310" cy="260" r="30" fill="#312e81" stroke="#a5b4fc"/>
  <circle cx="425" cy="190" r="30" fill="#f59e0b" stroke="#f59e0b"/>
  <g text-anchor="middle" font-family="Consolas, monospace">
    <text x="195" y="188" fill="#93c5fd" font-size="13" font-weight="bold">v</text><text x="195" y="203" fill="#93c5fd" font-size="10">no keys</text>
    <text x="310" y="118" fill="#c4b5fd" font-size="13" font-weight="bold">v</text><text x="310" y="133" fill="#c4b5fd" font-size="10">{A}</text>
    <text x="310" y="258" fill="#a5b4fc" font-size="13" font-weight="bold">v</text><text x="310" y="273" fill="#a5b4fc" font-size="10">{B}</text>
    <text x="425" y="188" fill="#0f172a" font-size="13" font-weight="bold">v</text><text x="425" y="203" fill="#0f172a" font-size="10">{A, B}</text>
  </g>

  <g font-size="10.5" fill="#f9a8d4" text-anchor="middle">
    <text x="236" y="138">pick up A</text>
    <text x="230" y="262">pick up B</text>
    <text x="376" y="136">pick up B</text>
    <text x="376" y="262">pick up A</text>
  </g>

  <text x="40" y="308" fill="#f59e0b" font-size="12.5" font-weight="bold">original edges sit inside each layer; only pickups cross layers</text>
  <text x="40" y="332" fill="#34d399" font-size="12.5" font-weight="bold">keys, fuel, stops-used and parity are all this same picture</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">a constraint that kills an algorithm's proof on the</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">original graph often vanishes on the right augmented</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">one: over (city, stops-used) every node again has a</text>
  <text x="510" y="148" fill="#e2e8f0" font-size="12.5">single well-defined optimum, and Dijkstra's cut is back</text>

  <text x="510" y="182" fill="#f59e0b" font-size="12.5" font-weight="bold">pick the algorithm from the AUGMENTED graph's</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5" font-weight="bold">weights &#8212; 864 is unweighted after augmenting, so it</text>
  <text x="510" y="222" fill="#f59e0b" font-size="12.5" font-weight="bold">is plain BFS despite being a Hard</text>

  <text x="510" y="256" fill="#34d399" font-size="12.5" font-weight="bold">two-step discipline: prove the state sufficient (equal</text>
  <text x="510" y="276" fill="#34d399" font-size="12.5" font-weight="bold">states &#8658; identical futures), then count it out loud</text>

  <text x="510" y="308" fill="#f87171" font-size="12">the price is V &#183; (resource values) states &#8212; sizing failures</text>
  <text x="510" y="326" fill="#f87171" font-size="12">show up as TLE/MLE, sufficiency failures as illegal paths</text>
</svg>
