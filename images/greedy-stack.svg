<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="320" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">THE STACK IS THE ANSWER &#8212; REMOVE K DIGITS ON 1432219, k = 3</text>

  <g font-size="10.5" fill="#64748b" font-weight="bold">
    <text x="48" y="80">read</text>
    <text x="104" y="80">rule that fires</text>
    <text x="300" y="80">k left</text>
    <text x="358" y="80">stack</text>
  </g>
  <line x1="44" y1="88" x2="450" y2="88" stroke="#1e293b" stroke-width="1.2"/>

  <g font-family="Consolas, monospace" font-size="12.5" font-weight="bold">
    <text x="48" y="110" fill="#93c5fd">1</text><text x="312" y="110" fill="#f59e0b">3</text><text x="358" y="110" fill="#c4b5fd">1</text>
    <text x="48" y="132" fill="#93c5fd">4</text><text x="312" y="132" fill="#f59e0b">3</text><text x="358" y="132" fill="#c4b5fd">14</text>
    <text x="48" y="154" fill="#93c5fd">3</text><text x="312" y="154" fill="#f59e0b">2</text><text x="358" y="154" fill="#c4b5fd">13</text>
    <text x="48" y="176" fill="#93c5fd">2</text><text x="312" y="176" fill="#f59e0b">1</text><text x="358" y="176" fill="#c4b5fd">12</text>
    <text x="48" y="198" fill="#93c5fd">2</text><text x="312" y="198" fill="#f59e0b">1</text><text x="358" y="198" fill="#c4b5fd">122</text>
    <text x="48" y="220" fill="#93c5fd">1</text><text x="312" y="220" fill="#f59e0b">0</text><text x="358" y="220" fill="#c4b5fd">121</text>
    <text x="48" y="242" fill="#93c5fd">9</text><text x="312" y="242" fill="#f59e0b">0</text><text x="358" y="242" fill="#f59e0b">1219</text>
  </g>

  <g font-size="11.5">
    <text x="104" y="110" fill="#94a3b8">push &#8212; stack is empty</text>
    <text x="104" y="132" fill="#94a3b8">push &#8212; 4 is larger than top 1</text>
    <text x="104" y="154" fill="#94a3b8">3 beats top 4 &#8594; pop, spend 1</text>
    <text x="104" y="176" fill="#94a3b8">2 beats top 3 &#8594; pop, spend 1</text>
    <text x="104" y="198" fill="#f59e0b">tie with top &#8212; NEVER pop on ties</text>
    <text x="104" y="220" fill="#94a3b8">1 beats top 2 &#8594; pop, spend 1</text>
    <text x="104" y="242" fill="#f59e0b">budget spent &#8594; push only</text>
  </g>

  <text x="44" y="276" fill="#34d399" font-size="12" font-weight="bold">result 1219 &#8212; smallest 4-digit subsequence in order</text>

  <text x="510" y="84" fill="#e2e8f0" font-size="12.5">lexicographic order is decided at the FIRST position</text>
  <text x="510" y="102" fill="#e2e8f0" font-size="12.5">of difference, so a smaller digit placed earlier beats</text>
  <text x="510" y="120" fill="#e2e8f0" font-size="12.5">EVERY completion of the version that kept the larger</text>
  <text x="510" y="152" fill="#34d399" font-size="12.5" font-weight="bold">that is the whole theorem: pop while the top is</text>
  <text x="510" y="170" fill="#34d399" font-size="12.5" font-weight="bold">larger AND the rules still permit removing it</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5">ties never pop &#8212; spending budget on an equal digit</text>
  <text x="510" y="220" fill="#f59e0b" font-size="12.5">buys nothing and starves a real improvement later</text>
  <text x="510" y="252" fill="#f87171" font-size="12">three killers: leftover k (trim from the tail), leading</text>
  <text x="510" y="270" fill="#f87171" font-size="12">zeros, and the empty result which must be &#8220;0&#8221;</text>
  <text x="510" y="292" fill="#64748b" font-size="12">316 adds one more guard: pop only if the letter</text>
  <text x="510" y="310" fill="#64748b" font-size="12">recurs later &#8212; otherwise the removal is irreversible</text>
</svg>
