<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">LONGEST VS SHORTEST: THE RECORD POINT IS THE ONLY DIFFERENCE</text>

  <line x1="445" y1="66" x2="445" y2="336" stroke="#334155" stroke-width="1.5"/>

  <text x="40"  y="82" fill="#93c5fd" font-size="13" font-weight="bold">PATTERN 2 &#8212; LONGEST VALID</text>
  <text x="460" y="82" fill="#c4b5fd" font-size="13" font-weight="bold">PATTERN 3 &#8212; SHORTEST VALID</text>

  <rect x="40" y="96" width="370" height="36" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="54" y="119" fill="#93c5fd" font-size="12">expand &#183; fold nums[right] into the state</text>
  <line x1="225" y1="132" x2="225" y2="150" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>

  <rect x="460" y="96" width="370" height="36" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="474" y="119" fill="#c4b5fd" font-size="12">expand &#183; fold nums[right] into the state</text>
  <line x1="645" y1="132" x2="645" y2="150" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arPurple)"/>

  <rect x="40" y="152" width="370" height="64" rx="6" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="54" y="175" fill="#a5b4fc" font-size="12" font-weight="bold">while the window is INVALID:</text>
  <text x="54" y="197" fill="#94a3b8" font-size="11.5">shrink to repair it &#8212; nothing is measured in here</text>

  <rect x="40" y="230" width="370" height="50" rx="6" fill="#f59e0b" stroke="#f59e0b"/>
  <text x="54" y="252" fill="#0f172a" font-size="12" font-weight="bold">RECORD AFTER THE LOOP</text>
  <text x="54" y="271" fill="#0f172a" font-size="11.5" font-family="Consolas, monospace">best = max(best, right - left + 1)</text>

  <rect x="460" y="152" width="370" height="118" rx="6" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="474" y="175" fill="#a5b4fc" font-size="12" font-weight="bold">while the window is VALID:</text>
  <rect x="476" y="186" width="338" height="50" rx="6" fill="#f59e0b" stroke="#f59e0b"/>
  <text x="490" y="208" fill="#0f172a" font-size="12" font-weight="bold">RECORD INSIDE THE LOOP</text>
  <text x="490" y="227" fill="#0f172a" font-size="11.5" font-family="Consolas, monospace">best = min(best, right - left + 1)</text>
  <text x="476" y="258" fill="#94a3b8" font-size="11.5">then shrink &#8212; the squeeze may break validity</text>

  <text x="40" y="306" fill="#34d399" font-size="12" font-weight="bold">the loop exits only once the window is valid</text>
  <text x="40" y="324" fill="#34d399" font-size="12" font-weight="bold">again, so one measurement per right suffices</text>

  <text x="460" y="306" fill="#34d399" font-size="12" font-weight="bold">every step of the squeeze is itself a valid</text>
  <text x="460" y="324" fill="#34d399" font-size="12" font-weight="bold">window, so each must be measured before it dies</text>

  <text x="40"  y="356" fill="#f59e0b" font-size="12.5" font-weight="bold">same skeleton, same pointers, same O(n) amortization</text>
  <text x="460" y="356" fill="#f87171" font-size="12">swapping these two points is the classic window bug</text>
</svg>
