<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="320" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">REACH SWEEP &#8212; BFS LAYERS STORED AS AN INTERVAL</text>

  <g fill="#64748b" font-size="10.5" text-anchor="middle" font-family="Consolas, monospace">
    <text x="88"  y="72">i=0</text>
    <text x="150" y="72">i=1</text>
    <text x="212" y="72">i=2</text>
    <text x="274" y="72">i=3</text>
    <text x="336" y="72">i=4</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="60"  y="80" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="88"  y="102" fill="#93c5fd">2</text>
    <rect x="122" y="80" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="150" y="102" fill="#c4b5fd">3</text>
    <rect x="184" y="80" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="212" y="102" fill="#c4b5fd">1</text>
    <rect x="246" y="80" width="56" height="34" rx="6" fill="#312e81" stroke="#6366f1"/><text x="274" y="102" fill="#a5b4fc">1</text>
    <rect x="308" y="80" width="56" height="34" rx="6" fill="#312e81" stroke="#6366f1"/><text x="336" y="102" fill="#a5b4fc">4</text>
  </g>

  <rect x="60"  y="124" width="56"  height="20" rx="5" fill="none" stroke="#3b82f6"/>
  <text x="88"  y="139" fill="#93c5fd" font-size="10.5" text-anchor="middle" font-weight="bold">L0</text>
  <rect x="122" y="124" width="118" height="20" rx="5" fill="none" stroke="#a78bfa"/>
  <text x="181" y="139" fill="#c4b5fd" font-size="10.5" text-anchor="middle" font-weight="bold">L1 &#183; 1 jump</text>
  <rect x="246" y="124" width="118" height="20" rx="5" fill="none" stroke="#6366f1"/>
  <text x="305" y="139" fill="#a5b4fc" font-size="10.5" text-anchor="middle" font-weight="bold">L2 &#183; 2 jumps</text>

  <line x1="116" y1="162" x2="116" y2="148" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <line x1="240" y1="162" x2="240" y2="148" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="116" y="177" fill="#f59e0b" font-size="10.5" text-anchor="middle" font-weight="bold">curEnd 0</text>
  <text x="240" y="177" fill="#f59e0b" font-size="10.5" text-anchor="middle" font-weight="bold">curEnd 2</text>

  <text x="40" y="210" fill="#94a3b8" font-size="12">layer 0: farthest = 0 + 2 = 2&#160;&#160;&#8658;&#160;&#160;jump 1, curEnd = 2</text>
  <text x="40" y="230" fill="#94a3b8" font-size="12">layer 1: farthest = max(1+3, 2+1) = 4&#160;&#160;&#8658;&#160;&#160;jump 2, curEnd = 4</text>
  <text x="40" y="252" fill="#34d399" font-size="12" font-weight="bold">curEnd = 4 &#8805; n-1 &#8212; the goal sits inside L2: answer is 2</text>

  <text x="510" y="84" fill="#e2e8f0" font-size="12.5">the positions reachable in exactly k jumps form a</text>
  <text x="510" y="102" fill="#e2e8f0" font-size="12.5">contiguous interval, so this IS BFS &#8212; each frontier</text>
  <text x="510" y="120" fill="#e2e8f0" font-size="12.5">is a range [curEnd+1, farthest], not a queue</text>
  <text x="510" y="152" fill="#34d399" font-size="12.5" font-weight="bold">staying ahead: farthest is the max over every</text>
  <text x="510" y="170" fill="#34d399" font-size="12.5" font-weight="bold">strategy's frontier, so no strategy can pass it</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5">you commit a jump only when FORCED (i == curEnd),</text>
  <text x="510" y="220" fill="#f59e0b" font-size="12.5">and always to the farthest edge the layer can reach</text>
  <text x="510" y="252" fill="#f87171" font-size="12">loop to n-1, not n &#8212; counting a jump FROM the goal</text>
  <text x="510" y="270" fill="#f87171" font-size="12">is the classic Jump Game II off-by-one</text>
  <text x="510" y="292" fill="#64748b" font-size="12">covering wants maximal extension; selection (P1)</text>
  <text x="510" y="310" fill="#64748b" font-size="12">wants minimal footprint &#8212; opposite sort keys</text>
</svg>
