<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">MONOTONIC STACK: WHY A POP IS PERMANENT</text>

  <text x="40" y="80" fill="#94a3b8" font-size="11.5">before &#8212; stack bottom to top, strictly decreasing</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="90" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="68"  y="112" fill="#93c5fd">5</text>
    <rect x="102" y="90" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="130" y="112" fill="#93c5fd">3</text>
    <rect x="164" y="90" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="192" y="112" fill="#93c5fd">1</text>
    <rect x="300" y="90" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="328" y="112" fill="#0f172a">4</text>
  </g>
  <text x="328" y="82" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">arrives</text>
  <line x1="294" y1="107" x2="234" y2="107" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>

  <text x="40" y="152" fill="#34d399" font-size="12" font-family="Consolas, monospace">4 &gt; 1  &#8594;  pop, ans[1] = 4</text>
  <text x="40" y="172" fill="#34d399" font-size="12" font-family="Consolas, monospace">4 &gt; 3  &#8594;  pop, ans[3] = 4</text>
  <text x="40" y="192" fill="#94a3b8" font-size="12" font-family="Consolas, monospace">4 &gt; 5  is false &#8594; stop; 5 still waiting</text>

  <text x="40" y="228" fill="#94a3b8" font-size="11.5">after &#8212; still strictly decreasing</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="238" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="68"  y="260" fill="#93c5fd">5</text>
    <rect x="102" y="238" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="130" y="260" fill="#0f172a">4</text>
  </g>
  <text x="40" y="300" fill="#94a3b8" font-size="11.5">the survivors are the non-dominated frontier</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">every pop is a resolution: the arriving element is</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">the next greater element of everything it outranks</text>

  <text x="510" y="140" fill="#34d399" font-size="12.5" font-weight="bold">domination &#8212; 4 is younger AND larger than 1 and 3,</text>
  <text x="510" y="160" fill="#34d399" font-size="12.5" font-weight="bold">so any future element meets 4 first; 1 and 3 can</text>
  <text x="510" y="180" fill="#34d399" font-size="12.5" font-weight="bold">never be anyone's answer again &#8658; popping is final</text>

  <text x="510" y="214" fill="#f59e0b" font-size="12.5" font-weight="bold">each index pushes once and pops once &#8658; O(n),</text>
  <text x="510" y="234" fill="#f59e0b" font-size="12.5" font-weight="bold">despite the nested-looking while loop</text>

  <text x="510" y="268" fill="#f87171" font-size="12">push INDICES, not values &#8212; spans and distances</text>
  <text x="510" y="286" fill="#f87171" font-size="12">need positions, which raw values cannot recover</text>

  <text x="510" y="316" fill="#64748b" font-size="11.5">whatever survives the scan has no next greater at all</text>
</svg>
