<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">DIJKSTRA SETTLES ON POP, NOT ON DISCOVERY</text>

  <line x1="105" y1="131" x2="216" y2="105" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <line x1="106" y1="150" x2="371" y2="171" stroke="#f87171" stroke-width="2.5" marker-end="url(#arRed)"/>
  <line x1="254" y1="112" x2="379" y2="156" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arBlue)"/>

  <circle cx="85"  cy="140" r="22" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="240" cy="95"  r="22" fill="#1e3a8a" stroke="#3b82f6"/>
  <circle cx="395" cy="175" r="22" fill="#f59e0b" stroke="#f59e0b"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="85"  y="146" fill="#93c5fd">S</text>
    <text x="240" y="101" fill="#93c5fd">A</text>
    <text x="395" y="181" fill="#0f172a">B</text>
  </g>

  <g font-size="11.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <text x="158" y="106" fill="#93c5fd">w = 1</text>
    <text x="325" y="126" fill="#93c5fd">w = 1</text>
    <text x="215" y="181" fill="#f87171">w = 5</text>
  </g>

  <g font-size="11.5" text-anchor="middle">
    <text x="85"  y="184" fill="#94a3b8">settled at 0</text>
    <text x="240" y="62"  fill="#94a3b8">settled at 1</text>
    <text x="395" y="216" fill="#f87171">discovered at 5</text>
    <text x="395" y="233" fill="#34d399" font-weight="bold">settled at 2</text>
  </g>

  <text x="40" y="266" fill="#94a3b8" font-size="11.5">the heap hands them back in cost order:</text>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="115" y="276" width="66" height="30" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="148" y="296" fill="#93c5fd">(0, S)</text>
    <rect x="187" y="276" width="66" height="30" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="220" y="296" fill="#93c5fd">(1, A)</text>
    <rect x="259" y="276" width="66" height="30" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="292" y="296" fill="#0f172a">(2, B)</text>
    <rect x="331" y="276" width="66" height="30" rx="6" fill="#1e293b" stroke="#64748b"/><text x="364" y="296" fill="#64748b">(5, B)</text>
  </g>
  <text x="364" y="322" fill="#64748b" font-size="10.5" text-anchor="middle">stale, skipped</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">a BFS habit says &#8220;the first time I reach B, that's final&#8221;</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">&#8212; and B is discovered one hop away, at 5. But the heap</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">returns A at 1 first, A relaxes B down to 2, and only</text>
  <text x="510" y="148" fill="#e2e8f0" font-size="12.5">that entry ever pops as settled</text>

  <text x="510" y="182" fill="#f59e0b" font-size="12.5" font-weight="bold">discovery order stops being cost order the moment</text>
  <text x="510" y="202" fill="#f59e0b" font-size="12.5" font-weight="bold">weights differ &#8212; so mark visited at POP, never at push</text>

  <text x="510" y="236" fill="#34d399" font-size="12.5" font-weight="bold">the popped minimum is safe by the cut argument: any</text>
  <text x="510" y="256" fill="#34d399" font-size="12.5" font-weight="bold">other route must exit the settled set at cost &#8805; d and,</text>
  <text x="510" y="276" fill="#34d399" font-size="12.5" font-weight="bold">with non-negative edges, can only grow from there</text>

  <text x="510" y="310" fill="#f87171" font-size="12">visited-at-enqueue here returns 5 for B. In BFS the same</text>
  <text x="510" y="328" fill="#f87171" font-size="12">confusion, reversed, merely wastes work &#8212; not so here</text>
</svg>
