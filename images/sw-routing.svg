<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">ROUTING A PROBLEM TO ITS WINDOW PATTERN</text>

  <rect x="40" y="64" width="250" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/>
  <text x="165" y="86" fill="#a5b4fc" font-size="12" text-anchor="middle">contiguous run of elements?</text>

  <line x1="165" y1="98" x2="165" y2="120" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <text x="174" y="114" fill="#34d399" font-size="10.5">yes</text>

  <rect x="40" y="122" width="250" height="34" rx="6" fill="#312e81" stroke="#a5b4fc"/>
  <text x="165" y="144" fill="#a5b4fc" font-size="12" text-anchor="middle">is k given, or is k the unknown?</text>

  <line x1="290" y1="139" x2="328" y2="139" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="309" y="133" fill="#f59e0b" font-size="10.5" text-anchor="middle">given</text>
  <rect x="332" y="122" width="128" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="396" y="144" fill="#93c5fd" font-size="12" text-anchor="middle">P1 &#183; fixed window</text>

  <line x1="165" y1="156" x2="165" y2="174" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="174" y="170" fill="#f59e0b" font-size="10.5">hunted</text>

  <rect x="40" y="176" width="250" height="30" rx="6" fill="#312e81" stroke="#a5b4fc"/>
  <text x="165" y="196" fill="#a5b4fc" font-size="12" text-anchor="middle">what exactly is asked?</text>

  <line x1="60" y1="206" x2="60" y2="322" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="60" y1="222" x2="76" y2="222"/>
    <line x1="60" y1="242" x2="76" y2="242"/>
    <line x1="60" y1="262" x2="76" y2="262"/>
    <line x1="60" y1="282" x2="76" y2="282"/>
    <line x1="60" y1="302" x2="76" y2="302"/>
    <line x1="60" y1="322" x2="76" y2="322"/>
  </g>
  <g font-size="11.5">
    <text x="84" y="226" fill="#93c5fd">longest valid &#8594; P2 &#183; record AFTER the shrink</text>
    <text x="84" y="246" fill="#f9a8d4">shortest valid &#8594; P3 &#183; record INSIDE the shrink</text>
    <text x="84" y="266" fill="#c4b5fd">count, at most K &#8594; P4 &#183; add right - left + 1</text>
    <text x="84" y="286" fill="#c4b5fd">count, exactly K &#8594; atMost(K) - atMost(K-1)</text>
    <text x="84" y="306" fill="#a5b4fc">max / min INSIDE the window &#8594; P5 &#183; deque</text>
    <text x="84" y="326" fill="#f59e0b" font-weight="bold">no legal shrink rule &#8594; P7 &#183; pin the variable</text>
  </g>

  <path d="M 40 81 L 26 81 L 26 344 L 38 344" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arRed)"/>
  <text x="32" y="106" fill="#f87171" font-size="10.5">no</text>
  <text x="44" y="348" fill="#f87171" font-size="11.5">answer survives reordering? &#8594; P6 &#183; sort first, then slide</text>
  <text x="44" y="366" fill="#64748b" font-size="11.5">if it does not, it is not a window at all &#8212; DP or prefix sums</text>

  <text x="510" y="88" fill="#e2e8f0" font-size="13" font-weight="bold">two questions decide almost everything:</text>
  <text x="510" y="118" fill="#e2e8f0" font-size="12.5">1. is the size handed to you, or is it the unknown</text>
  <text x="510" y="136" fill="#e2e8f0" font-size="12.5">you are searching for?</text>
  <text x="510" y="160" fill="#e2e8f0" font-size="12.5">2. does validity change monotonically as the</text>
  <text x="510" y="178" fill="#e2e8f0" font-size="12.5">window grows?</text>

  <text x="510" y="212" fill="#34d399" font-size="12.5" font-weight="bold">answer both and the template is forced &#8212; the</text>
  <text x="510" y="232" fill="#34d399" font-size="12.5" font-weight="bold">rest is bookkeeping, not invention</text>

  <text x="510" y="266" fill="#f59e0b" font-size="12">longest and shortest are the same loop with the</text>
  <text x="510" y="284" fill="#f59e0b" font-size="12">measurement moved; exactly-K is never monotonic</text>
  <text x="510" y="302" fill="#f59e0b" font-size="12">alone, only as a difference of two at-most passes</text>

  <text x="510" y="336" fill="#f87171" font-size="12">if no shrink rule is legal in EITHER direction, stop</text>
  <text x="510" y="354" fill="#f87171" font-size="12">sliding &#8212; pin the free variable and enumerate it</text>
</svg>
