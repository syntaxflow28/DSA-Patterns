<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">LC 1168: A COST THAT SITS ON A NODE IS NOT AN MST &#8212; INVENT THE MISSING ENDPOINT</text>
  <line x1="455" y1="70" x2="455" y2="350" stroke="#1e293b" stroke-width="2"/>

  <text x="40" y="82" fill="#f87171" font-size="12.5" font-weight="bold">BEFORE &#8212; well cost lives ON the house</text>

  <line x1="138" y1="200" x2="242" y2="200" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="258" y1="200" x2="362" y2="200" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="190" y="192" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">1</text>
  <text x="310" y="192" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">1</text>

  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <circle cx="120" cy="200" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/><text x="120" y="205" fill="#93c5fd">1</text>
    <circle cx="250" cy="200" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/><text x="250" y="205" fill="#93c5fd">2</text>
    <circle cx="380" cy="200" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/><text x="380" y="205" fill="#93c5fd">3</text>
  </g>
  <g font-size="11.5" text-anchor="middle" font-family="Consolas, monospace" fill="#f59e0b">
    <text x="120" y="248">well = 1</text>
    <text x="250" y="248">well = 2</text>
    <text x="380" y="248">well = 2</text>
  </g>
  <line x1="120" y1="142" x2="120" y2="176" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arRed)"/>
  <text x="150" y="132" fill="#f87171" font-size="12" font-weight="bold">a cost with only one endpoint</text>

  <text x="40" y="290" fill="#e2e8f0" font-size="12.5">Kruskal and Prim read EDGE weights only. A per-house</text>
  <text x="40" y="310" fill="#e2e8f0" font-size="12.5">build cost has no second endpoint, so neither algorithm</text>
  <text x="40" y="330" fill="#e2e8f0" font-size="12.5">can be started &#8212; the graph is the wrong shape.</text>

  <text x="490" y="82" fill="#34d399" font-size="12.5" font-weight="bold">AFTER &#8212; node 0 is the ground water</text>

  <line x1="629" y1="128" x2="581" y2="182" stroke="#34d399" stroke-width="2.5"/>
  <line x1="640" y1="128" x2="640" y2="182" stroke="#64748b" stroke-width="2.5"/>
  <line x1="651" y1="128" x2="699" y2="182" stroke="#64748b" stroke-width="2.5"/>
  <line x1="538" y1="200" x2="622" y2="200" stroke="#34d399" stroke-width="2.5"/>
  <line x1="658" y1="200" x2="742" y2="200" stroke="#34d399" stroke-width="2.5"/>
  <g font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <text x="583" y="150" fill="#34d399">1</text>
    <text x="656" y="152" fill="#94a3b8">2</text>
    <text x="700" y="150" fill="#94a3b8">2</text>
    <text x="580" y="236" fill="#34d399">1</text>
    <text x="700" y="236" fill="#34d399">1</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <circle cx="640" cy="110" r="18" fill="#f59e0b" stroke="#f59e0b" stroke-width="2.5"/><text x="640" y="115" fill="#0f172a">0</text>
    <circle cx="520" cy="200" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/><text x="520" y="205" fill="#93c5fd">1</text>
    <circle cx="640" cy="200" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/><text x="640" y="205" fill="#93c5fd">2</text>
    <circle cx="760" cy="200" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.5"/><text x="760" y="205" fill="#93c5fd">3</text>
  </g>
  <text x="672" y="94" fill="#f59e0b" font-size="12" font-weight="bold">virtual source</text>

  <text x="490" y="248" fill="#34d399" font-size="12.5" font-weight="bold">well[i] &#8658; edge (0, i, well[i])</text>
  <text x="490" y="290" fill="#e2e8f0" font-size="12.5">Every cost is now an edge cost, so one plain MST over</text>
  <text x="490" y="310" fill="#e2e8f0" font-size="12.5">n+1 nodes solves it. Connected to node 0 &#8801; has water,</text>
  <text x="490" y="330" fill="#e2e8f0" font-size="12.5">so a spanning tree &#8801; a valid plan &#183; 1 + 1 + 1 = 3</text>
</svg>
