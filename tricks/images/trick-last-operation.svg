<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">LC 312 BURST BALLOONS: THE BOUNDARY IS THE WHOLE GAME</text>
  <line x1="445" y1="62" x2="445" y2="336" stroke="#1e293b" stroke-width="2"/>

  <text x="40" y="78" fill="#f87171" font-size="12.5" font-weight="bold">PICK WHICH BURSTS FIRST</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="95" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="68"  y="117" fill="#94a3b8">i-1</text>
    <rect x="100" y="95" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="128" y="117" fill="#93c5fd">i</text>
    <rect x="160" y="95" width="56" height="34" rx="6" fill="#f59e0b" stroke="#fbbf24"/><text x="188" y="117" fill="#0f172a">k</text>
    <rect x="220" y="95" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="248" y="117" fill="#93c5fd">j</text>
    <rect x="280" y="95" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="308" y="117" fill="#94a3b8">j+1</text>
  </g>
  <line x1="188" y1="140" x2="188" y2="170" stroke="#f87171" stroke-width="2.5" marker-end="url(#arRed)"/>
  <text x="204" y="161" fill="#f87171" font-size="11">k pops now</text>
  <g font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="180" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="68"  y="202" fill="#94a3b8">i-1</text>
    <rect x="104" y="180" width="86" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="147" y="202" fill="#93c5fd">[i,k-1]</text>
    <rect x="198" y="180" width="86" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="241" y="202" fill="#93c5fd">[k+1,j]</text>
    <rect x="292" y="180" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="320" y="202" fill="#94a3b8">j+1</text>
  </g>
  <line x1="194" y1="172" x2="194" y2="226" stroke="#f87171" stroke-width="2.5" stroke-dasharray="4 4"/>
  <text x="40" y="250" fill="#f87171" font-size="12" font-weight="bold">the halves now TOUCH</text>
  <text x="40" y="272" fill="#94a3b8" font-size="12">whatever nums[k-1] finally multiplies</text>
  <text x="40" y="290" fill="#94a3b8" font-size="12">against depends on the order played</text>
  <text x="40" y="308" fill="#94a3b8" font-size="12">inside [k+1,j] &#8212; the boundary is</text>
  <text x="40" y="326" fill="#94a3b8" font-size="12">ragged, so there is no state to store</text>

  <text x="460" y="78" fill="#34d399" font-size="12.5" font-weight="bold">PICK WHICH BURSTS LAST</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="460" y="95" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="488" y="117" fill="#94a3b8">i-1</text>
    <rect x="520" y="95" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="548" y="117" fill="#93c5fd">i</text>
    <rect x="580" y="95" width="56" height="34" rx="6" fill="#f59e0b" stroke="#fbbf24"/><text x="608" y="117" fill="#0f172a">k</text>
    <rect x="640" y="95" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="668" y="117" fill="#93c5fd">j</text>
    <rect x="700" y="95" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="728" y="117" fill="#94a3b8">j+1</text>
  </g>
  <line x1="608" y1="140" x2="608" y2="170" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <text x="624" y="161" fill="#34d399" font-size="11">k pops last</text>
  <g font-size="12" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="460" y="180" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="488" y="202" fill="#94a3b8">i-1</text>
    <rect x="524" y="180" width="76" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4"/><text x="562" y="202" fill="#64748b">gone</text>
    <rect x="610" y="180" width="56" height="34" rx="6" fill="#f59e0b" stroke="#fbbf24"/><text x="638" y="202" fill="#0f172a">k</text>
    <rect x="676" y="180" width="76" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4"/><text x="714" y="202" fill="#64748b">gone</text>
    <rect x="762" y="180" width="56" height="34" rx="6" fill="#1e293b" stroke="#475569"/><text x="790" y="202" fill="#94a3b8">j+1</text>
  </g>
  <path d="M488,218 Q563,250 632,218" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <path d="M644,218 Q716,250 786,218" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <text x="460" y="264" fill="#34d399" font-size="12.5" font-weight="bold">i-1 and j+1 are alive BY DEFINITION</text>
  <text x="460" y="286" fill="#e2e8f0" font-size="12">k's payout is fixed the moment you name it,</text>
  <text x="460" y="304" fill="#e2e8f0" font-size="12">and neither half can ever see the other &#8212;</text>
  <text x="460" y="322" fill="#e2e8f0" font-size="12">two independent subproblems, one recurrence</text>

  <text x="40" y="358" fill="#f8fafc" font-size="11.5" font-family="Consolas, monospace">dp[i][j] = max over k of  dp[i][k-1] + nums[i-1]*nums[k]*nums[j+1] + dp[k+1][j]</text>
</svg>
