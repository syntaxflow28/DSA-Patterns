<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">IN-PLACE ENCODING: THE CELL HOLDS BOTH STATES AT ONCE</text>

  <text x="40" y="75" fill="#f59e0b" font-size="12.5" font-weight="bold">LC 289 &#183; bit 0 = OLD, bit 1 = NEW</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="90"  y="88" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="118" y="110" fill="#93c5fd">0b01</text>
    <rect x="152" y="88" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="180" y="110" fill="#c4b5fd">0b11</text>
    <rect x="214" y="88" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="242" y="110" fill="#c4b5fd">0b10</text>
    <rect x="276" y="88" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="304" y="110" fill="#93c5fd">0b00</text>
  </g>
  <line x1="70"  y1="168" x2="105" y2="128" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <line x1="362" y1="168" x2="322" y2="128" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="26"  y="190" fill="#34d399" font-size="12.5" font-weight="bold">v &amp; 1 &#8594; OLD value</text>
  <text x="26"  y="209" fill="#94a3b8" font-size="11.5">every neighbour count still</text>
  <text x="26"  y="225" fill="#94a3b8" font-size="11.5">reads the pre-update grid</text>
  <text x="288" y="190" fill="#f59e0b" font-size="12.5" font-weight="bold">v &#62;&#62; 1 &#8594; NEW value</text>
  <text x="288" y="209" fill="#94a3b8" font-size="11.5">one second pass commits</text>
  <text x="288" y="225" fill="#94a3b8" font-size="11.5">the whole board at once</text>

  <text x="40" y="264" fill="#f59e0b" font-size="12.5" font-weight="bold">LC 442 &#183; sign = presence, |v| = payload</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="90"  y="278" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="118" y="300" fill="#c4b5fd">-4</text>
    <rect x="152" y="278" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="180" y="300" fill="#93c5fd">3</text>
    <rect x="214" y="278" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="242" y="300" fill="#c4b5fd">-2</text>
    <rect x="276" y="278" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="304" y="300" fill="#c4b5fd">-4</text>
  </g>
  <text x="40" y="336" fill="#94a3b8" font-size="11.5">nums[abs(v)-1] *= -1 &#8212; already negative &#8658; second sighting &#8658; duplicate</text>

  <text x="510" y="90"  fill="#e2e8f0" font-size="12.5">&#8220;constant extra space&#8221; plus values that need fewer</text>
  <text x="510" y="110" fill="#e2e8f0" font-size="12.5">bits than the cell provides &#8658; the spare bits ARE the</text>
  <text x="510" y="130" fill="#e2e8f0" font-size="12.5">scratch array you were forbidden to allocate</text>
  <text x="510" y="162" fill="#34d399" font-size="12.5" font-weight="bold">a simultaneous update needs BOTH states live:</text>
  <text x="510" y="181" fill="#34d399" font-size="12.5" font-weight="bold">reads must see the old board while writes have</text>
  <text x="510" y="200" fill="#34d399" font-size="12.5" font-weight="bold">already landed &#8212; two bits, zero copies</text>
  <text x="510" y="232" fill="#e2e8f0" font-size="12.5">reversibility is the only requirement: old = v &amp; 1</text>
  <text x="510" y="252" fill="#e2e8f0" font-size="12.5">recovers the input exactly, so nothing is lost until</text>
  <text x="510" y="272" fill="#e2e8f0" font-size="12.5">you deliberately shift the new state down</text>
  <text x="510" y="304" fill="#f87171" font-size="12">banned when the input is read-only (LC 287), and</text>
  <text x="510" y="322" fill="#f87171" font-size="12">broken when a real value collides with the marker</text>
  <text x="510" y="340" fill="#f87171" font-size="12">&#8212; 0 has no sign, so it needs its own sentinel</text>
</svg>
