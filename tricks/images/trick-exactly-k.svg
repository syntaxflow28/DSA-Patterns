<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">EXACTLY K AS A DIFFERENCE OF TWO MONOTONE COUNTS</text>

  <text x="40" y="78" fill="#94a3b8" font-size="11.5">subarrays laid out by how many distinct values they hold</text>

  <rect x="60" y="92" width="340" height="32" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="230" y="113" fill="#c4b5fd" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">atMost(K)</text>

  <rect x="60" y="142" width="250" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="185" y="163" fill="#93c5fd" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">atMost(K-1)</text>

  <rect x="310" y="192" width="90" height="32" rx="6" fill="#f59e0b" stroke="#fbbf24"/>
  <text x="355" y="213" fill="#0f172a" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">== K</text>

  <line x1="310" y1="92" x2="310" y2="192" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="92" x2="400" y2="192" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="270" y1="240" x2="330" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>

  <text x="40" y="262" fill="#94a3b8" font-size="11.5">the blue set is contained in the purple one, so the</text>
  <text x="40" y="280" fill="#94a3b8" font-size="11.5">shell between them is counted with a subtraction</text>
  <text x="40" y="308" fill="#34d399" font-size="12.5" font-weight="bold">exactly(K) = atMost(K) - atMost(K-1)</text>

  <text x="510" y="90"  fill="#e2e8f0" font-size="12.5">a sliding window only works when the predicate is</text>
  <text x="510" y="110" fill="#e2e8f0" font-size="12.5">monotone: shrinking a window can never break</text>
  <text x="510" y="130" fill="#e2e8f0" font-size="12.5">&#8220;at most K&#8221;, so the left pointer never rewinds</text>
  <text x="510" y="158" fill="#e2e8f0" font-size="12.5">for each right end, atMost(K) adds right - left + 1</text>
  <text x="510" y="178" fill="#e2e8f0" font-size="12.5">valid subarrays &#8212; every subarray with &#8804; K distinct</text>
  <text x="510" y="198" fill="#e2e8f0" font-size="12.5">is charged to exactly one right end</text>
  <text x="510" y="232" fill="#34d399" font-size="12.5" font-weight="bold">two monotone O(n) passes subtract into the</text>
  <text x="510" y="252" fill="#34d399" font-size="12.5" font-weight="bold">non-monotone answer &#8658; still O(n) overall</text>
  <text x="510" y="288" fill="#f87171" font-size="12">shrinking on &#8220;exactly K&#8221; is unsound: a window with</text>
  <text x="510" y="306" fill="#f87171" font-size="12">K distinct can drop to K-1 on one step, so the rule</text>
  <text x="510" y="324" fill="#f87171" font-size="12">has no direction &#8212; never window exactly-K directly</text>
</svg>
