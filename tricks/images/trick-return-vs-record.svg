<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">LC 124: THE RETURNED VALUE IS NOT THE ANSWER</text>

  <line x1="170" y1="90"  x2="95"  y2="175" stroke="#334155" stroke-width="2"/>
  <line x1="170" y1="90"  x2="255" y2="175" stroke="#334155" stroke-width="2"/>
  <line x1="255" y1="175" x2="205" y2="258" stroke="#f59e0b" stroke-width="4"/>
  <line x1="255" y1="175" x2="315" y2="258" stroke="#f59e0b" stroke-width="4"/>
  <line x1="250" y1="158" x2="180" y2="110" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>

  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <circle cx="170" cy="90"  r="18" fill="#1e3a8a" stroke="#3b82f6"/><text x="170" y="95"  fill="#93c5fd">-10</text>
    <circle cx="95"  cy="175" r="18" fill="#1e3a8a" stroke="#3b82f6"/><text x="95"  y="180" fill="#93c5fd">9</text>
    <circle cx="255" cy="175" r="18" fill="#f59e0b" stroke="#f59e0b"/><text x="255" y="180" fill="#0f172a">20</text>
    <circle cx="205" cy="258" r="18" fill="#4c1d95" stroke="#a78bfa"/><text x="205" y="263" fill="#c4b5fd">15</text>
    <circle cx="315" cy="258" r="18" fill="#4c1d95" stroke="#a78bfa"/><text x="315" y="263" fill="#c4b5fd">7</text>
  </g>

  <text x="300" y="130" fill="#34d399" font-size="11.5" font-weight="bold">returns 35</text>
  <text x="40" y="308" fill="#f59e0b" font-size="12.5" font-weight="bold">RECORD the bend at 20: 15 &#183; 20 &#183; 7 = 42</text>
  <text x="40" y="332" fill="#34d399" font-size="12.5" font-weight="bold">RETURN one branch: 20 + max(15, 7) = 35</text>

  <text x="510" y="90"  fill="#e2e8f0" font-size="12.5">the parent -10 reaches 20 through a single edge, so it</text>
  <text x="510" y="110" fill="#e2e8f0" font-size="12.5">enters and leaves that subtree once &#8212; it may borrow</text>
  <text x="510" y="130" fill="#e2e8f0" font-size="12.5">at most ONE downward chain hanging under 20</text>
  <text x="510" y="162" fill="#34d399" font-size="12.5" font-weight="bold">so the call returns 35, the best usable chain,</text>
  <text x="510" y="182" fill="#34d399" font-size="12.5" font-weight="bold">and writes 42 into a global best as it passes</text>
  <text x="510" y="214" fill="#f87171" font-size="12">return 42 instead and -10 happily builds -10 + 42,</text>
  <text x="510" y="232" fill="#f87171" font-size="12">a walk that visits 20 twice &#8212; not a path at all</text>
  <text x="510" y="264" fill="#94a3b8" font-size="12">gain = max(0, child) drops chains that only subtract</text>
  <text x="510" y="284" fill="#94a3b8" font-size="12">answer lives in the global &#8658; never in the return</text>
  <text x="510" y="312" fill="#64748b" font-size="12">same shape: 543 diameter &#183; 687 univalue &#183; 1372 zigzag</text>
</svg>
