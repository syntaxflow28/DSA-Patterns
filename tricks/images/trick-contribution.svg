<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">CONTRIBUTION COUNTING: LEFT &#183; RIGHT SUBARRAYS PER ELEMENT</text>

  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40"  y="80" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="68"  y="102" fill="#93c5fd">7</text>
    <rect x="100" y="80" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="128" y="102" fill="#c4b5fd">2</text>
    <rect x="160" y="80" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="188" y="102" fill="#93c5fd">8</text>
    <rect x="220" y="80" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="248" y="102" fill="#0f172a">5</text>
    <rect x="280" y="80" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="308" y="102" fill="#93c5fd">9</text>
    <rect x="340" y="80" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="368" y="102" fill="#c4b5fd">5</text>
    <rect x="400" y="80" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="428" y="102" fill="#93c5fd">6</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace">
    <text x="68"  y="132">0</text><text x="128" y="132">1</text><text x="188" y="132">2</text>
    <text x="248" y="132">3</text><text x="308" y="132">4</text><text x="368" y="132">5</text>
    <text x="428" y="132">6</text>
  </g>

  <line x1="276" y1="145" x2="162" y2="145" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <text x="152" y="149" fill="#34d399" font-size="12" font-weight="bold" text-anchor="end">left = 2</text>
  <line x1="220" y1="169" x2="334" y2="169" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="344" y="173" fill="#f59e0b" font-size="12" font-weight="bold">right = 2</text>

  <text x="40" y="200" fill="#34d399" font-size="12.5" font-weight="bold">left &#183; right = 2 &#183; 2 = 4 subarrays whose minimum is a[3]</text>
  <text x="40" y="228" fill="#c4b5fd" font-size="11.5">index 1 (value 2): previous STRICTLY smaller &#8212; hard wall</text>
  <text x="40" y="246" fill="#c4b5fd" font-size="11.5">index 5 (value 5): next smaller-OR-EQUAL &#8212; the tie rule</text>
  <text x="40" y="276" fill="#f87171" font-size="12">if index 5 were a strict wall too, both 5's would claim</text>
  <text x="40" y="294" fill="#f87171" font-size="12">the subarray [2 .. 5] &#8212; one object, two owners</text>

  <text x="510" y="90" fill="#e2e8f0" font-size="12.5">every subarray has exactly one minimum, so</text>
  <text x="510" y="110" fill="#e2e8f0" font-size="12.5">sum over subarrays of min &#8658; sum over elements of</text>
  <text x="510" y="130" fill="#e2e8f0" font-size="12.5">a[i] &#183; (how many subarrays a[i] owns)</text>
  <text x="510" y="168" fill="#34d399" font-size="12.5" font-weight="bold">an element owns a rectangle of subarrays:</text>
  <text x="510" y="188" fill="#34d399" font-size="12.5" font-weight="bold">left endpoints &#183; right endpoints, O(n) by stack</text>
  <text x="510" y="224" fill="#94a3b8" font-size="11.5">prevLess: pop while a[top] &#8805; a[i]</text>
  <text x="510" y="242" fill="#94a3b8" font-size="11.5">nextLessOrEqual: pop while a[top] &gt; a[i]</text>
  <text x="510" y="276" fill="#f87171" font-size="12">strict on one side, non-strict on the other &#8212; ties</text>
  <text x="510" y="294" fill="#f87171" font-size="12">go to the rightmost equal element, always exactly one</text>
</svg>
