<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>

  <text x="40" y="45" fill="#f8fafc" font-size="14" font-weight="bold">INVERT THE STATE: INDEX BY LENGTH, NOT BY POSITION</text>

  <text x="40" y="78" fill="#94a3b8" font-size="11.5">dp[i] &#8212; indexed by POSITION, stores the length</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="110" y="88"  width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="138" y="110" fill="#93c5fd">2</text>
    <rect x="172" y="88"  width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="200" y="110" fill="#93c5fd">5</text>
    <rect x="234" y="88"  width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="262" y="110" fill="#93c5fd">3</text>
    <rect x="296" y="88"  width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="324" y="110" fill="#93c5fd">7</text>
    <rect x="110" y="128" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="138" y="150" fill="#c4b5fd">1</text>
    <rect x="172" y="128" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="200" y="150" fill="#c4b5fd">2</text>
    <rect x="234" y="128" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="262" y="150" fill="#c4b5fd">2</text>
    <rect x="296" y="128" width="56" height="34" rx="6" fill="#4c1d95" stroke="#a78bfa"/><text x="324" y="150" fill="#c4b5fd">3</text>
  </g>
  <text x="40" y="110" fill="#64748b" font-size="11.5" font-family="Consolas, monospace">nums</text>
  <text x="40" y="150" fill="#64748b" font-size="11.5" font-family="Consolas, monospace">dp</text>
  <text x="368" y="150" fill="#f87171" font-size="11.5">every cell scans all j &lt; i &#8658; O(n&#178;)</text>

  <text x="40" y="196" fill="#94a3b8" font-size="11.5">tails[len] &#8212; indexed by LENGTH, stores the tail</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="110" y="206" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="138" y="228" fill="#93c5fd">2</text>
    <rect x="172" y="206" width="56" height="34" rx="6" fill="#f59e0b" stroke="#f59e0b"/><text x="200" y="228" fill="#0f172a">5</text>
    <rect x="110" y="270" width="56" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6"/><text x="138" y="292" fill="#93c5fd">2</text>
    <rect x="172" y="270" width="56" height="34" rx="6" fill="#34d399" stroke="#34d399"/><text x="200" y="292" fill="#0f172a">3</text>
  </g>
  <text x="40" y="228" fill="#64748b" font-size="11.5" font-family="Consolas, monospace">before</text>
  <text x="40" y="292" fill="#64748b" font-size="11.5" font-family="Consolas, monospace">after</text>
  <line x1="304" y1="223" x2="238" y2="223" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arAmber)"/>
  <text x="312" y="227" fill="#f59e0b" font-size="12" font-weight="bold">x = 3 lands on first tail &#8805; 3</text>
  <line x1="200" y1="246" x2="200" y2="264" stroke="#34d399" stroke-width="2.5" marker-end="url(#arGreen)"/>
  <text x="240" y="292" fill="#94a3b8" font-size="11.5">overwrite &#8212; size unchanged, LIS still 2</text>

  <text x="40" y="336" fill="#34d399" font-size="12.5" font-weight="bold">tails stays SORTED, so lower_bound is legal &#8212; O(n log n)</text>
  <text x="40" y="356" fill="#94a3b8" font-size="11.5">the answer became the index; the quantity became the payload</text>

  <text x="510" y="88"  fill="#e2e8f0" font-size="12.5">dp[i] = &#8220;LIS ending at i&#8221; depends on every earlier</text>
  <text x="510" y="108" fill="#e2e8f0" font-size="12.5">position, so filling one cell costs a full scan. Nothing</text>
  <text x="510" y="128" fill="#e2e8f0" font-size="12.5">about that layout can be binary searched.</text>

  <text x="510" y="162" fill="#34d399" font-size="12.5" font-weight="bold">why tails is sorted for free:</text>
  <text x="510" y="182" fill="#e2e8f0" font-size="12.5">any increasing chain of length k+1 contains one of</text>
  <text x="510" y="202" fill="#e2e8f0" font-size="12.5">length k whose tail is strictly smaller, so the best</text>
  <text x="510" y="222" fill="#e2e8f0" font-size="12.5">length-k tail beats the best length-(k+1) tail:</text>
  <text x="510" y="242" fill="#93c5fd" font-size="12.5" font-family="Consolas, monospace">tails[k] &lt; tails[k+1] holds by construction</text>

  <text x="510" y="276" fill="#e2e8f0" font-size="12.5">a smaller tail is never worse &#8212; it accepts every</text>
  <text x="510" y="296" fill="#e2e8f0" font-size="12.5">future element the old tail accepted, and more.</text>

  <text x="510" y="330" fill="#f87171" font-size="12">tails is NOT a real subsequence &#8212; only its LENGTH</text>
  <text x="510" y="348" fill="#f87171" font-size="12">is meaningful. If you must reconstruct or count the</text>
  <text x="510" y="366" fill="#f87171" font-size="12">chains (673), go back to the O(n&#178;) table.</text>
</svg>
